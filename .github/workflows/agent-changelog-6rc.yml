name: One-shot 6.0 RC Changelog Patch

on:
  push:
    branches: [revamp/6.0.0-gui-animation-overhaul]
    paths:
      - '.agent/apply-6rc-changelog'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/6.0.0-gui-animation-overhaul
          fetch-depth: 0
      - name: Add 6.0 RC changelog section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          source = path.read_text()
          anchor = '# Changelog\n\nAll notable PlexonCrates changes are documented here.\n\n'
          if source.count(anchor) != 1:
              raise SystemExit('Unexpected changelog header')
          entry = '''## 6.0.0-rc.1 — Runtime certification candidate\n\n### Added\n\n- Added first-class player **My Keys** and paginated **Opening History** GUIs using existing authoritative key/history data sources and the centralized inventory router.\n- Added native-byte exact-item diagnostics for resolved key templates, Reward Builder delivery stacks, global reward browsing and Test Lab without mutating canonical/source ItemStacks.\n- Added named opening profiles in `animations.yml` with `INSTANT`, `ROULETTE`, `SPIN`, `CHARGE_REVEAL`, `SPIRAL_BURST`, `ORB_REVEAL`, `CASCADE` and `FIREWORK_STYLE`, explicit animation stages, bounded particles/sounds and global/per-crate assignment.\n- Added named physical idle profiles in `idle-animations.yml` with reusable geometry/range/budget settings, global/per-crate assignment and an in-game editor.\n- Added migration-safe reserved `legacy` inheritance for both opening and idle profiles so existing 5.x presentation is preserved until deliberately overridden.\n- Added bounded Test Lab previews that reuse the production opening renderer and a one-frame idle preview without adding per-viewer/profile repeating tasks.\n\n### Changed\n\n- Production opening result presentation now resolves the effective 6.0 profile only after the authoritative reward/payment/delivery/finalization path has completed.\n- Physical linked-crate particles now resolve the effective per-crate idle profile while retaining one shared scheduler, indexed nearby-chunk discovery, receiver-scoped emission and global performance ceilings.\n- Updated GUI/migration/testing/release documentation for the 6.0 product boundary and real-host certification gate.\n- Kept SQLite schema `4`; new profile registries remain presentation-only files and do not duplicate durable transaction/player state.\n\n### Preserved\n\n- `OpeningService` remains the sole opening transaction authority; reward selection, journal/payment/revalidation/grant ordering, limits, pity, cooldowns, milestones, rerolls, claims/recovery and statistics are not moved into animation or GUI code.\n- Exact item authority remains native Paper bytes; no Material/name/lore/plugin-ID reconstruction is introduced.\n- PlexonKeys integration, durable draft/publication revisions, portable issuance/signing/replay protection, Phoenix migration boundaries and the `v5.0.0` rollback baseline remain intact.\n\n### Release state\n\n- Target runtime: Paper `26.2.build.121-stable`, Java `25`, PlexonCore `2.0.4`, PlexonKeys API `2.0.0-rc.2`.\n- This is a prerelease candidate. GitHub source/distribution CI is required before publication, followed by real PlexonCraft startup, GUI/opening, exact-item persistence/recovery and active-use performance/soak certification.\n- Stable `v6.0.0` is forbidden until the exact published RC artifact is runtime-certified.\n\n'''
          path.write_text(source.replace(anchor, anchor + entry, 1))
          PY
          git diff --check
          git diff -- CHANGELOG.md
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'Document PlexonCrates 6.0.0-rc.1 changes'
          git push origin HEAD:revamp/6.0.0-gui-animation-overhaul
