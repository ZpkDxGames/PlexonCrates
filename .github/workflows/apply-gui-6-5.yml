name: Apply PlexonCrates 6.5 GUI transform

on:
  push:
    branches: [revamp/6.5.0-full-gui-design-system]
    paths:
      - tools/apply_gui_6_5.py
      - .github/workflows/apply-gui-6-5.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: revamp/6.5.0-full-gui-design-system
          fetch-depth: 0

      - name: Prepare transform runtime
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Apply deterministic source transform
        run: python3 tools/apply_gui_6_5.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Remove temporary transform machinery
        run: |
          rm -f tools/apply_gui_6_5.py
          rm -f .github/workflows/apply-gui-6-5.yml

      - name: Commit transformed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement PlexonCrates 6.5 GUI design system'
          git push origin HEAD:revamp/6.5.0-full-gui-design-system
