name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read
  statuses: write

env:
  PLUGIN_VERSION: '5.0.0-rc.3'
  PHASE2_SHA: 'ec9623857dd09437c29a251c4f1fb01f5b4fd98e'
  ACCEPTED_PHASE3_SHA: 'f1bcb27186489b47c8692d126e0b1974e25881fa'
  RELIABILITY_SHA: 'c1b84c76430fd7196acc6ea4d45976e1b0740786'
  PLEXONKEYS_VERSION: '2.0.0-rc.2'
  PLEXONKEYS_SHA256: '0cc87449754b7e5dec34e57091f856f2bfa98a3c256eb41617b510911cbe0ee4'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Provision immutable Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"; keys="${RUNNER_TEMP}/PlexonKeys-${PLEXONKEYS_VERSION}.jar"
          curl --fail --location --silent --show-error -o "$core" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core" | sha256sum --check
          curl --fail --location --silent --show-error -o "$keys" "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v${PLEXONKEYS_VERSION}/PlexonKeys-${PLEXONKEYS_VERSION}.jar"
          echo "${PLEXONKEYS_SHA256}  $keys" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$core" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$keys" -DgroupId=com.antondev -DartifactId=PlexonKeys -Dversion="$PLEXONKEYS_VERSION" -Dpackaging=jar -DgeneratePom=true
      - name: Verify dependency and candidate contract
        run: |
          set -euo pipefail
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = 26.2.build.121-stable
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = 2.0.4
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexonkeys.version)" = "$PLEXONKEYS_VERSION"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$PLUGIN_VERSION"
          test -f "releases/${PLUGIN_VERSION}.md"
          git merge-base --is-ancestor "$PHASE2_SHA" HEAD
          git merge-base --is-ancestor "$RELIABILITY_SHA" HEAD
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
      - name: Test and package
        run: mvn -B -ntp clean verify
      - name: Verify tests and distribution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,pathlib,xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              for c in ET.parse(p).getroot().iter('testcase'):
                  t+=1; f+=c.find('failure') is not None; e+=c.find('error') is not None; s+=c.find('skipped') is not None
          if not t or f or e or s: raise SystemExit(f'tests={t} failures={f} errors={e} skipped={s}')
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(f'tests={t}\nfailures={f}\nerrors={e}\nskipped={s}\n'); print(f'Tests: {t}; failures=0; errors=0; skipped=0')
          PY
          JAR="target/PlexonCrates-${PLUGIN_VERSION}.jar"; test -s "$JAR"; jar tf "$JAR" > target/jar-contents.txt
          for r in plugin.yml com/antondev/crates/PlexonCrates.class com/antondev/crates/service/OpeningService.class com/antondev/crates/service/ClaimService.class com/antondev/crates/service/CrateSimulationService.class com/antondev/crates/integration/plexonkeys/PlexonKeysServiceAdapter.class com/antondev/crates/api/event/CrateOpenEvent.class org/sqlite/JDBC.class; do grep -qx "$r" target/jar-contents.txt; done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"; unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${PLUGIN_VERSION}"
          javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          for prefix in 'com/zpkdxgames/plexoncore/' 'com/antondev/keys/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/' 'net/luckperms/api/'; do if grep -q "^$prefix" target/jar-contents.txt; then echo "Forbidden dependency shading: $prefix" >&2; exit 1; fi; done
          (cd target && sha256sum "PlexonCrates-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Write provenance
        run: |
          JAR="target/PlexonCrates-${PLUGIN_VERSION}.jar"; size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}')
          { echo repository=ZpkDxGames/PlexonCrates; echo candidate_sha=$GITHUB_SHA; echo accepted_phase3=$ACCEPTED_PHASE3_SHA; echo reliability_ancestor=$RELIABILITY_SHA; echo version=$PLUGIN_VERSION; echo java=25; echo java_major=69; echo paper=26.2.build.121-stable; echo plexoncore=2.0.4; echo plexonkeys=$PLEXONKEYS_VERSION; echo database_schema=4; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > target/PROVENANCE.txt
      - name: Check full diff
        run: git diff --check "${PHASE2_SHA}...HEAD"
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonCrates-${{ env.PLUGIN_VERSION }}-${{ github.sha }}
          path: |
            target/PlexonCrates-${{ env.PLUGIN_VERSION }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt
          if-no-files-found: error
