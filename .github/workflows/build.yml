name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  statuses: write

env:
  PLUGIN_VERSION: '5.0.0-rc.1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.3.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          curl --fail --location --silent --show-error \
            --output "${keys_jar}" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.3.0/PlexonKeys-1.3.0.jar"
          echo "301ead99d56ed48b96a8983e68837b6f04d4629d8a9dec90db0ef090fa3b0796  ${keys_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.4 \
            -Dpackaging=jar \
            -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${keys_jar}" \
            -DgroupId=com.antondev \
            -DartifactId=PlexonKeys \
            -Dversion=1.3.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify dependency and candidate contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = "2.0.4"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexonkeys.version)" = "1.3.0"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "${PLUGIN_VERSION}"

      - name: Verify
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean verify 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Require every discovered test to run
        id: skipped
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          skipped = []
          count = 0
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  marker = case.find("skipped")
                  if marker is not None:
                      skipped.append((case.get("classname"), case.get("name"), marker.get("message", "")))
          if count == 0:
              print("No tests were discovered")
              sys.exit(1)
          if skipped:
              print(f"Skipped tests are not allowed: {len(skipped)}")
              for class_name, name, message in skipped:
                  print(f"- {class_name}.{name}: {message}")
              sys.exit(1)
          print(f"All discovered tests ran; total={count}; skipped=0")
          PY
          code=$?
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Verify distribution
        id: distribution
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            JAR="target/PlexonCrates-${PLUGIN_VERSION}.jar"
            test -s "$JAR"
            jar tf "$JAR" > target/jar-contents.txt
            grep -qx 'plugin.yml' target/jar-contents.txt
            grep -qx 'com/antondev/crates/PlexonCrates.class' target/jar-contents.txt
            grep -qx 'com/antondev/crates/PlexonCratesPremium.class' target/jar-contents.txt
            grep -qx 'com/antondev/crates/service/CrateSimulationService.class' target/jar-contents.txt
            grep -qx 'com/antondev/crates/gui/SimulationAdminListener.class' target/jar-contents.txt
            grep -qx 'com/antondev/crates/integration/core/PlexonCoreBridge.class' target/jar-contents.txt
            grep -qx 'com/antondev/crates/api/event/CrateOpenEvent.class' target/jar-contents.txt
            grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
            unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"
            unzip -p "$JAR" plugin.yml | grep -F 'main: com.antondev.crates.PlexonCratesPremium'
            unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
            unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${PLUGIN_VERSION}"
            javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCratesPremium | grep -F 'major version: 69'
            if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
              echo "PlexonCore runtime classes must not be shaded into PlexonCrates" >&2
              exit 1
            fi
            if grep -q '^com/antondev/keys/' target/jar-contents.txt; then
              echo "PlexonKeys runtime classes must not be shaded into PlexonCrates" >&2
              exit 1
            fi
            (
              cd target
              sha256sum "PlexonCrates-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt
              sha256sum --check SHA256SUMS.txt
            )
          ) 2>&1 | tee distribution.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Check whitespace
        id: whitespace
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          git diff --check HEAD^ HEAD
          code=$?
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlexonCrates-test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            build.log
            distribution.log
          if-no-files-found: warn

      - name: Upload verified JAR
        if: steps.verify.outputs.exit_code == '0' && steps.skipped.outputs.exit_code == '0' && steps.distribution.outputs.exit_code == '0' && steps.whitespace.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: PlexonCrates-${{ github.sha }}
          path: |
            target/PlexonCrates-${{ env.PLUGIN_VERSION }}.jar
            target/SHA256SUMS.txt
          if-no-files-found: error

      - name: Enforce result
        if: always()
        env:
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
          SKIPPED_EXIT: ${{ steps.skipped.outputs.exit_code }}
          DISTRIBUTION_EXIT: ${{ steps.distribution.outputs.exit_code }}
          WHITESPACE_EXIT: ${{ steps.whitespace.outputs.exit_code }}
        run: |
          test "${VERIFY_EXIT:-1}" = "0"
          test "${SKIPPED_EXIT:-1}" = "0"
          test "${DISTRIBUTION_EXIT:-1}" = "0"
          test "${WHITESPACE_EXIT:-1}" = "0"
