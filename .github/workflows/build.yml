name: Build

on:
  push:
    branches:
      - agent/revamp-blueprint
      - agent/4.0-exact-items-gui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlexonCrates-4.0.0-SNAPSHOT
          path: target/PlexonCrates-4.0.0-SNAPSHOT.jar
          if-no-files-found: error
