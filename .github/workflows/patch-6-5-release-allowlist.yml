name: Patch PlexonCrates 6.5 release allowlist

on:
  push:
    branches: [revamp/6.5.0-full-gui-design-system]
    paths: [.github/workflows/patch-6-5-release-allowlist.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/6.5.0-full-gui-design-system
          fetch-depth: 0
      - name: Add README to GUI-only release scope and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          text = p.read_text()
          old = 'CHANGELOG.md|pom.xml|docs/*|"releases/${PLUGIN_VERSION}.md"|\\\n'
          new = 'CHANGELOG.md|README.md|pom.xml|docs/*|"releases/${PLUGIN_VERSION}.md"|\\\n'
          if old not in text:
              raise SystemExit('release allowlist anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/patch-6-5-release-allowlist.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Allow 6.5 README documentation in stable GUI scope'
          git push origin HEAD:revamp/6.5.0-full-gui-design-system
