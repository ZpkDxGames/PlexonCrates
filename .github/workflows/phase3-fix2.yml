name: Phase 3 Fix 2

on:
  push:
    branches:
      - 'phase3/runtime-reliability'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-fix2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: phase3/runtime-reliability
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply recovery correction
        run: python3 tools/phase3_fix2.py
      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "payment_state IN ('COMMITTED','NOT_REQUIRED')" src/main/java/com/antondev/crates/database/DatabaseService.java
          grep -F 'PlexonKeysServiceAdapter.available(plugin)' src/main/java/com/antondev/crates/service/KeyService.java
          grep -F 'markManualReview(decision.transactionId, "REROLL_COST_RESERVED"' src/main/java/com/antondev/crates/service/OpeningService.java
          grep -F 'entry.createdAt()' src/main/java/com/antondev/crates/PlexonCrates.java
          test -f src/test/java/com/antondev/crates/Phase3RecoveryStateTest.java
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java src/test/java
          git commit -m 'fix: align RC2 typed recovery state machine [fix2-applied]'
          git push origin HEAD:phase3/runtime-reliability
