name: Publish PlexonCrates 4.6.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-4.6.0-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision immutable Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.3.0.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          curl --fail --location --silent --show-error --output "$keys_jar" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.3.0/PlexonKeys-1.3.0.jar"
          echo "301ead99d56ed48b96a8983e68837b6f04d4629d8a9dec90db0ef090fa3b0796  $keys_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$keys_jar" -DgroupId=com.antondev -DartifactId=PlexonKeys \
            -Dversion=1.3.0 -Dpackaging=jar -DgeneratePom=true

      - name: Verify exact merged commit
        run: mvn -B -ntp clean verify

      - name: Require zero skipped tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          count = 0
          skipped = []
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  if case.find("skipped") is not None:
                      skipped.append(f"{case.get('classname')}.{case.get('name')}")
          if count == 0 or skipped:
              print(f"tests={count} skipped={len(skipped)}")
              for item in skipped:
                  print(item)
              sys.exit(1)
          print(f"tests={count} skipped=0")
          PY

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonCrates-4.6.0.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/crates/PlexonCrates.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/integration/core/PlexonCoreBridge.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '4.6.0'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'Implementation-Version: 4.6.0'
          javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then exit 1; fi
          if grep -q '^com/antondev/keys/' target/jar-contents.txt; then exit 1; fi
          sha256sum "$JAR" > target/SHA256SUMS.txt
          (cd target && sha256sum --check SHA256SUMS.txt)

      - name: Publish immutable v4.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.6.0 >/dev/null 2>&1; then
            echo 'v4.6.0 already exists; refusing to replace immutable release assets.'
            exit 0
          fi
          gh release create v4.6.0 \
            target/PlexonCrates-4.6.0.jar \
            target/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonCrates 4.6.0' \
            --notes-file releases/4.6.0.md
