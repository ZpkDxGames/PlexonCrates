name: Publish 4.6.0 RC1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-4.6.0-rc1.yml'

permissions:
  contents: write

concurrency:
  group: plexoncrates-publish-4.6.0-rc1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Confirm candidate state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "4.6.0"
          if git ls-remote --exit-code --tags origin refs/tags/v4.6.0 >/dev/null 2>&1; then
            echo "Stable v4.6.0 already exists; refusing candidate publisher." >&2
            exit 1
          fi
          if gh release view v4.6.0-rc.1 >/dev/null 2>&1; then
            echo "v4.6.0-rc.1 already exists; refusing to mutate an existing candidate release." >&2
            exit 1
          fi

      - name: Provision immutable Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.0.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.3.0.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.0/PlexonCore-2.0.0.jar"
          echo "179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec  $core_jar" | sha256sum --check
          curl --fail --location --silent --show-error \
            --output "$keys_jar" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.3.0/PlexonKeys-1.3.0.jar"
          echo "301ead99d56ed48b96a8983e68837b6f04d4629d8a9dec90db0ef090fa3b0796  $keys_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.0 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$keys_jar" -DgroupId=com.antondev -DartifactId=PlexonKeys \
            -Dversion=1.3.0 -Dpackaging=jar -DgeneratePom=true
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = "2.0.0"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexonkeys.version)" = "1.3.0"

      - name: Verify candidate
        run: mvn -B -ntp clean verify

      - name: Require zero skipped tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          skipped = []
          count = 0
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  marker = case.find("skipped")
                  if marker is not None:
                      skipped.append((case.get("classname"), case.get("name"), marker.get("message", "")))
          if count == 0:
              print("No tests were discovered")
              sys.exit(1)
          if skipped:
              print(f"Skipped tests are not allowed: {len(skipped)}")
              for class_name, name, message in skipped:
                  print(f"- {class_name}.{name}: {message}")
              sys.exit(1)
          print(f"Candidate tests: total={count}; skipped=0")
          PY

      - name: Verify candidate JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonCrates-4.6.0.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/crates/PlexonCrates.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/integration/core/PlexonCoreBridge.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/api/event/CrateOpenEvent.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '4.6.0'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'Implementation-Version: 4.6.0'
          javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore classes were shaded unexpectedly" >&2
            exit 1
          fi
          if grep -q '^com/antondev/keys/' target/jar-contents.txt; then
            echo "PlexonKeys classes were shaded unexpectedly" >&2
            exit 1
          fi
          (
            cd target
            sha256sum PlexonCrates-4.6.0.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish immutable prerelease candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v4.6.0-rc.1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "PlexonCrates 4.6.0 RC1"
          git push origin "$TAG"
          {
            echo "> **Release candidate — not stable.** Automated source/build/distribution gates passed, but the implementation contract's production-like Paper/Spark, 5-player, 10-player, and 30-minute soak gates were not executable in repository CI. PlexonKeys 1.4.0 is also not yet published; this candidate was verified against stable PlexonKeys 1.3.0."
            echo
            cat releases/4.6.0.md
          } > target/RC_NOTES.md
          gh release create "$TAG" \
            target/PlexonCrates-4.6.0.jar \
            target/SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "PlexonCrates 4.6.0 RC1" \
            --notes-file target/RC_NOTES.md
