name: Publish PlexonCrates 5.0.0-rc.3 once

on:
  push:
    branches: [phase3/release-v5.0.0-rc.3]
    paths: ['.github/workflows/publish-phase3-rc.3-once.yml', 'src/test/java/com/antondev/crates/Phase2SimulationContractTest.java']
permissions: {contents: write}
env:
  PLUGIN_VERSION: '5.0.0-rc.3'
  PLEXONKEYS_VERSION: '2.0.0-rc.2'
  PLEXONKEYS_SHA256: '0cc87449754b7e5dec34e57091f856f2bfa98a3c256eb41617b510911cbe0ee4'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Prove ancestry and release-only delta
        run: |
          set -euo pipefail
          UX=f1bcb27186489b47c8692d126e0b1974e25881fa; REL=c1b84c76430fd7196acc6ea4d45976e1b0740786
          git merge-base --is-ancestor "$UX" HEAD; git merge-base --is-ancestor "$REL" HEAD
          git diff --name-only "$UX" HEAD | tee /tmp/delta
          if grep -Ev '^(pom\.xml|releases/5\.0\.0-rc\.3\.md|\.github/workflows/build\.yml|\.github/workflows/publish-phase3-rc\.3-once\.yml|src/test/java/com/antondev/crates/Phase2SimulationContractTest\.java)$' /tmp/delta | grep -q .; then echo 'Non-release-only delta' >&2; exit 1; fi
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Provision immutable dependencies
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"; keys="${RUNNER_TEMP}/PlexonKeys-${PLEXONKEYS_VERSION}.jar"
          curl -fLsS -o "$core" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar; echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core"|sha256sum --check
          curl -fLsS -o "$keys" "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v${PLEXONKEYS_VERSION}/PlexonKeys-${PLEXONKEYS_VERSION}.jar"; echo "${PLEXONKEYS_SHA256}  $keys"|sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$core" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$keys" -DgroupId=com.antondev -DartifactId=PlexonKeys -Dversion="$PLEXONKEYS_VERSION" -Dpackaging=jar -DgeneratePom=true
      - name: Build exact candidate
        run: mvn -B -ntp clean verify
      - name: Verify and package evidence
        run: |
          set -euo pipefail
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$PLUGIN_VERSION"; test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = 26.2.build.121-stable
          JAR="target/PlexonCrates-${PLUGIN_VERSION}.jar"; test -s "$JAR"; jar tf "$JAR" > target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"; unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"; javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          for prefix in 'com/zpkdxgames/plexoncore/' 'com/antondev/keys/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/' 'net/luckperms/api/'; do if grep -q "^$prefix" target/jar-contents.txt; then exit 1; fi; done
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              for c in ET.parse(p).getroot().iter('testcase'): t+=1; f+=c.find('failure') is not None; e+=c.find('error') is not None; s+=c.find('skipped') is not None
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(f'tests={t}\nfailures={f}\nerrors={e}\nskipped={s}\n'); print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          (cd target && sha256sum "PlexonCrates-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); { echo repository=$GITHUB_REPOSITORY; echo commit=$GITHUB_SHA; echo accepted_phase3=f1bcb27186489b47c8692d126e0b1974e25881fa; echo reliability_ancestor=c1b84c76430fd7196acc6ea4d45976e1b0740786; echo version=$PLUGIN_VERSION; echo java_major=69; echo paper=26.2.build.121-stable; echo database_schema=4; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > target/PROVENANCE.txt
      - name: Publish immutable prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG=v5.0.0-rc.3
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          gh release create "$TAG" target/PlexonCrates-5.0.0-rc.3.jar target/SHA256SUMS.txt target/TEST_SUMMARY.txt target/PROVENANCE.txt --target "$GITHUB_SHA" --prerelease --title 'PlexonCrates 5.0.0-rc.3' --notes-file releases/5.0.0-rc.3.md
