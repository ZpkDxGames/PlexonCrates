name: Publish PlexonCrates 3.0.0 Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: plexoncrates-publish-v3.0.0-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: cdae9e4b557f32206d877ff762a1b54278eba3fa
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.2.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          curl --fail --location --silent --show-error \
            --output "${keys_jar}" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.2.0/PlexonKeys-1.2.0.jar"
          echo "c961c08749edc67a679af19adbb1e625032477a7a3f91553ef27ae737f544d05  ${keys_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${keys_jar}" \
            -DgroupId=com.antondev \
            -DartifactId=PlexonKeys \
            -Dversion=1.2.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion=3.0.0 -DgenerateBackupPoms=false

      - name: Verify release
        run: mvn -B -ntp clean verify

      - name: Verify release distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonCrates-3.0.0.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonCrates" >&2
            exit 1
          fi
          if grep -q '^com/antondev/keys/' target/jar-contents.txt; then
            echo "PlexonKeys runtime classes must not be shaded into PlexonCrates" >&2
            exit 1
          fi
          (
            cd target
            sha256sum PlexonCrates-3.0.0.jar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v3.0.0 >/dev/null 2>&1; then
            echo "v3.0.0 already exists; refusing to move it."
          else
            git tag v3.0.0 cdae9e4b557f32206d877ff762a1b54278eba3fa
            git push origin refs/tags/v3.0.0
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.0.0 >/dev/null 2>&1; then
            echo "Release v3.0.0 already exists; refusing to mutate immutable assets."
            exit 0
          fi
          gh release create v3.0.0 \
            target/PlexonCrates-3.0.0.jar \
            target/SHA256SUMS.txt \
            --verify-tag \
            --title "PlexonCrates 3.0.0" \
            --notes-file releases/3.0.0.md
