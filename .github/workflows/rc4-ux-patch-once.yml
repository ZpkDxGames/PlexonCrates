name: Apply RC4 UX patch once

on:
  push:
    branches:
      - release/5.0.0-rc.4
    paths:
      - .github/workflows/rc4-ux-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: release/5.0.0-rc.4
      - name: Apply patch
        run: python3 scripts/rc4_ux_patch.py
      - name: Restore accepted router and remove helpers
        run: |
          set -euo pipefail
          git checkout ca781fae9815ea5a0dee1d09611320cef6b48511 -- src/main/java/com/antondev/crates/gui/player/PlayerCrateCommandRouter.java
          git rm -f src/test/java/com/antondev/crates/gui/player/LegacyPlayerSurfaceRoutingTest.java
          git rm -f scripts/rc4_ux_patch.py
          git rm -f .github/workflows/rc4-ux-patch-once.yml
          git diff --check
      - name: Commit scoped correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish compatibility preview player presentation'
          git push origin HEAD:release/5.0.0-rc.4
