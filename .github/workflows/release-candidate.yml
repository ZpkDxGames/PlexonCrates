name: Release Candidate

on:
  push:
    branches:
      - 'release/5.0.0-rc.1'

permissions:
  contents: write

concurrency:
  group: plexoncrates-5.0.0-rc.1
  cancel-in-progress: false

env:
  PLUGIN_VERSION: '5.0.0-rc.1'
  RELEASE_TAG: 'v5.0.0-rc.1'

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "release/${PLUGIN_VERSION}"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "${PLUGIN_VERSION}"
          test -f "releases/${PLUGIN_VERSION}.md"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to move or replace an RC tag." >&2
            exit 1
          fi

      - name: Provision immutable Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.3.0.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          curl --fail --location --silent --show-error --output "$keys_jar" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.3.0/PlexonKeys-1.3.0.jar"
          echo "301ead99d56ed48b96a8983e68837b6f04d4629d8a9dec90db0ef090fa3b0796  $keys_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$keys_jar" -DgroupId=com.antondev -DartifactId=PlexonKeys -Dversion=1.3.0 -Dpackaging=jar -DgeneratePom=true

      - name: Full release-candidate verification
        shell: bash
        run: mvn -B -ntp clean verify

      - name: Require zero skipped tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          count = 0
          skipped = []
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  if case.find("skipped") is not None:
                      skipped.append(f"{case.get('classname')}.{case.get('name')}")
          if count == 0:
              raise SystemExit("No tests discovered")
          if skipped:
              print("Skipped tests are forbidden:")
              print("\n".join(skipped))
              sys.exit(1)
          print(f"Release candidate tests: {count}; skipped=0")
          PY

      - name: Verify candidate distribution and checksum
        id: files
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonCrates-${PLUGIN_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/crates/PlexonCrates.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/service/CrateSimulationService.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/gui/SimulationAdminListener.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/api/event/CrateOpenEvent.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F 'main: com.antondev.crates.PlexonCrates'
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${PLUGIN_VERSION}"
          javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore must remain provided/non-shaded" >&2
            exit 1
          fi
          if grep -q '^com/antondev/keys/' target/jar-contents.txt; then
            echo "PlexonKeys must remain provided/non-shaded" >&2
            exit 1
          fi
          (cd target && sha256sum "PlexonCrates-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git diff --check HEAD^ HEAD
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Tag exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.files.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" "$JAR" target/SHA256SUMS.txt \
            --verify-tag --prerelease --target "${GITHUB_SHA}" \
            --title "PlexonCrates ${PLUGIN_VERSION}" --notes-file "releases/${PLUGIN_VERSION}.md"
