name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plexoncrates-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify release
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Resolve release files
        id: release
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          JAR="target/PlexonCrates-${VERSION}.jar"
          test -f "$JAR"
          sha256sum "$JAR" > "${JAR}.sha256"
          test -f "releases/${VERSION}.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          JAR: ${{ steps.release.outputs.jar }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its tag and assets immutable."
            exit 0
          fi
          gh release create "$TAG" "$JAR" "${JAR}.sha256" \
            --target "$GITHUB_SHA" \
            --title "PlexonCrates ${VERSION}" \
            --notes-file "releases/${VERSION}.md"
