name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: plexoncrates-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Stable semver tags only. Explicit RC tags are published by their gated
    # candidate workflow and must never be mistaken for stable releases.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve and verify tag version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$GITHUB_REF_NAME" != "v${POM_VERSION}" || "$VERSION" != "$POM_VERSION" ]]; then
            echo "Tag/project version mismatch: tag=${GITHUB_REF_NAME}, project=${POM_VERSION}" >&2
            exit 1
          fi
          test -f "releases/${VERSION}.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Provision immutable Plexon API dependencies
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          keys_jar="${RUNNER_TEMP}/PlexonKeys-1.3.0.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          curl --fail --location --silent --show-error \
            --output "$keys_jar" \
            "https://github.com/ZpkDxGames/PlexonKeys/releases/download/v1.3.0/PlexonKeys-1.3.0.jar"
          echo "301ead99d56ed48b96a8983e68837b6f04d4629d8a9dec90db0ef090fa3b0796  $keys_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$keys_jar" -DgroupId=com.antondev -DartifactId=PlexonKeys \
            -Dversion=1.3.0 -Dpackaging=jar -DgeneratePom=true
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = "2.0.4"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexonkeys.version)" = "1.3.0"

      - name: Verify release
        run: mvn -B -ntp clean verify

      - name: Require every discovered test to run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          skipped = []
          count = 0
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  marker = case.find("skipped")
                  if marker is not None:
                      skipped.append((case.get("classname"), case.get("name"), marker.get("message", "")))
          if count == 0:
              print("No tests were discovered")
              sys.exit(1)
          if skipped:
              print(f"Skipped tests are not allowed: {len(skipped)}")
              for class_name, name, message in skipped:
                  print(f"- {class_name}.{name}: {message}")
              sys.exit(1)
          print(f"All discovered release tests ran; total={count}; skipped=0")
          PY

      - name: Verify release distribution
        id: files
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonCrates-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/antondev/crates/PlexonCrates.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/integration/core/PlexonCoreBridge.class' target/jar-contents.txt
          grep -qx 'com/antondev/crates/api/event/CrateOpenEvent.class' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.antondev.crates.PlexonCrates | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonCrates" >&2
            exit 1
          fi
          if grep -q '^com/antondev/keys/' target/jar-contents.txt; then
            echo "PlexonKeys runtime classes must not be shaded into PlexonCrates" >&2
            exit 1
          fi
          (
            cd target
            sha256sum "PlexonCrates-${VERSION}.jar" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          JAR: ${{ steps.files.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its tag and assets immutable."
            exit 0
          fi
          gh release create "$TAG" "$JAR" target/SHA256SUMS.txt \
            --verify-tag \
            --title "PlexonCrates ${VERSION}" \
            --notes-file "releases/${VERSION}.md"
