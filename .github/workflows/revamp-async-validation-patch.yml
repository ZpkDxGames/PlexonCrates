name: Revamp asynchronous live validation patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-async-validation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply asynchronous live validation patch
        run: python tools/revamp_patch_async_validation.py
      - name: Commit source patch and remove temporary helpers
        run: |
          git rm .github/workflows/revamp-async-validation-patch.yml tools/revamp_patch_async_validation.py
          git add src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/gui/AdminMenuService.java \
                  src/main/java/com/antondev/crates/command/CratesAdminCommand.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "perf: move live validation file IO off the server thread"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
