name: Revamp composition patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-compose.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply explicit composition patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} changed unexpectedly: {count} matches')
              return updated

          session = Path('src/main/java/com/antondev/crates/gui/GuiSessionService.java')
          text = session.read_text()
          for line in [
              'import com.antondev.crates.PlexonCrates;\n',
              'import com.antondev.crates.gui.player.PlayerCrateCommandRouter;\n',
              'import com.antondev.crates.service.CrateSimulationService;\n',
              'import org.bukkit.Bukkit;\n',
              'import org.bukkit.plugin.Plugin;\n',
          ]:
              text = text.replace(line, '')
          text = replace_once(
              text,
              r'    private final ConcurrentHashMap<UUID, Active> active = new ConcurrentHashMap<>\(\);\n'
              r'    private final CrateSimulationService simulations;\n\n'
              r'    public GuiSessionService\(\) \{.*?\n    \}\n',
              '    private final ConcurrentHashMap<UUID, Active> active = new ConcurrentHashMap<>();\n',
              'GuiSessionService constructor block')
          text = replace_once(
              text,
              r'    public void clear\(\) \{\n        active\.clear\(\);\n        simulations\.close\(\);\n    \}\n\n'
              r'    public int size\(\) \{\n        return active\.size\(\);\n    \}\n\n'
              r'    public int simulationQueueSize\(\) \{.*?\n    \}\n\n'
              r'    public int activeSimulations\(\) \{.*?\n    \}\n',
              '    public void clear() {\n        active.clear();\n    }\n\n    public int size() {\n        return active.size();\n    }\n',
              'GuiSessionService clear/tail block')
          session.write_text(text)

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          text = main.read_text()
          text = text.replace(
              'import com.antondev.crates.gui.AdminMenuService;\n',
              'import com.antondev.crates.gui.AdminMenuService;\nimport com.antondev.crates.gui.SimulationAdminListener;\nimport com.antondev.crates.gui.player.PlayerCrateCommandRouter;\n')
          text = text.replace(
              'import com.antondev.crates.service.CrateRegistry;\n',
              'import com.antondev.crates.service.CrateRegistry;\nimport com.antondev.crates.service.CrateSimulationService;\n')
          text = text.replace(
              '    private GuiSessionService guiSessions;\n',
              '    private GuiSessionService guiSessions;\n    private CrateSimulationService simulations;\n')
          text = text.replace(
              '            guiSessions = new GuiSessionService();\n',
              '            guiSessions = new GuiSessionService();\n            simulations = new CrateSimulationService();\n')
          marker = '            getServer().getPluginManager().registerEvents(menus, this);\n'
          if text.count(marker) != 1:
              raise SystemExit('PlexonCrates listener registration marker changed unexpectedly')
          text = text.replace(marker, marker
              + '            getServer().getPluginManager().registerEvents(new SimulationAdminListener(this, simulations), this);\n'
              + '            getServer().getPluginManager().registerEvents(new PlayerCrateCommandRouter(this), this);\n', 1)
          marker = '        if (guiSessions != null) guiSessions.clear();\n'
          if text.count(marker) != 1:
              raise SystemExit('PlexonCrates disable marker changed unexpectedly')
          text = text.replace(marker, marker + '        if (simulations != null) simulations.close();\n', 1)
          main.write_text(text)

          test = Path('src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java')
          text = test.read_text()
          marker = '    private static final Path SESSION = Path.of("src/main/java/com/antondev/crates/gui/GuiSessionService.java");\n'
          if text.count(marker) != 1:
              raise SystemExit('Architecture test SESSION marker changed unexpectedly')
          text = text.replace(marker, marker
              + '    private static final Path MAIN = Path.of("src/main/java/com/antondev/crates/PlexonCrates.java");\n', 1)
          replacement = '''    @Test void playerUxReusesExistingGuiSessionAuthority() throws IOException {
              String session = Files.readString(SESSION);
              String holder = Files.readString(HOLDER);
              String main = Files.readString(MAIN);
              assertTrue(holder.contains("PLAYER_HALL"));
              assertTrue(session.contains("ConcurrentHashMap<UUID, Active> active"));
              assertFalse(session.contains("registerEvents"));
              assertFalse(session.contains("PlayerCrateCommandRouter"));
              assertTrue(main.contains("registerEvents(new PlayerCrateCommandRouter(this), this)"));
              assertTrue(main.contains("registerEvents(new SimulationAdminListener(this, simulations), this)"));
              assertTrue(main.contains("if (simulations != null) simulations.close()"));
              assertFalse(Files.readString(UX).contains("new GuiSessionService"));
          }
          '''
          replacement = replacement.replace('          ', '')
          text = replace_once(
              text,
              r'    @Test void playerUxReusesExistingGuiSessionAuthority\(\) throws IOException \{.*?\n    \}\n',
              replacement,
              'Architecture test session-authority block')
          test.write_text(text)
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/revamp-compose.yml
          git add src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/gui/GuiSessionService.java \
                  src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "refactor: make GUI runtime composition explicit"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
