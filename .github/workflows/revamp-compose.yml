name: Revamp composition patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-compose.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply explicit composition patch
        shell: python
        run: |
          from pathlib import Path

          session = Path('src/main/java/com/antondev/crates/gui/GuiSessionService.java')
          text = session.read_text()
          for line in [
              'import com.antondev.crates.PlexonCrates;\n',
              'import com.antondev.crates.gui.player.PlayerCrateCommandRouter;\n',
              'import com.antondev.crates.service.CrateSimulationService;\n',
              'import org.bukkit.Bukkit;\n',
              'import org.bukkit.plugin.Plugin;\n',
          ]:
              text = text.replace(line, '')
          old = '''    private final ConcurrentHashMap<UUID, Active> active = new ConcurrentHashMap<>();
              private final CrateSimulationService simulations;

              public GuiSessionService() {
                  Plugin candidate = Bukkit.getPluginManager().getPlugin("PlexonCrates");
                  if (!(candidate instanceof PlexonCrates plugin)) {
                      throw new IllegalStateException("PlexonCrates plugin instance is unavailable while GUI runtime starts");
                  }
                  simulations = new CrateSimulationService();
                  Bukkit.getPluginManager().registerEvents(new SimulationAdminListener(plugin, simulations), plugin);
                  // The player UX reuses this authority but is routed only through the ordinary command/menu surface.
                  Bukkit.getPluginManager().registerEvents(new PlayerCrateCommandRouter(plugin), plugin);
              }
          '''
          old = old.replace('              ', '')
          new = '    private final ConcurrentHashMap<UUID, Active> active = new ConcurrentHashMap<>();\n'
          if old not in text:
              raise SystemExit('GuiSessionService constructor block changed unexpectedly')
          text = text.replace(old, new)
          old_tail = '''    public void clear() {
              active.clear();
              simulations.close();
          }

          public int size() {
              return active.size();
          }

          public int simulationQueueSize() {
              return simulations.queuedRequests();
          }

          public int activeSimulations() {
              return simulations.activeRequests();
          }
          '''.replace('          ', '')
          new_tail = '''    public void clear() {
              active.clear();
          }

          public int size() {
              return active.size();
          }
          '''.replace('          ', '')
          if old_tail not in text:
              raise SystemExit('GuiSessionService clear/tail block changed unexpectedly')
          session.write_text(text.replace(old_tail, new_tail))

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          text = main.read_text()
          text = text.replace(
              'import com.antondev.crates.gui.AdminMenuService;\n',
              'import com.antondev.crates.gui.AdminMenuService;\nimport com.antondev.crates.gui.SimulationAdminListener;\nimport com.antondev.crates.gui.player.PlayerCrateCommandRouter;\n')
          text = text.replace(
              'import com.antondev.crates.service.CrateRegistry;\n',
              'import com.antondev.crates.service.CrateRegistry;\nimport com.antondev.crates.service.CrateSimulationService;\n')
          text = text.replace(
              '    private GuiSessionService guiSessions;\n',
              '    private GuiSessionService guiSessions;\n    private CrateSimulationService simulations;\n')
          text = text.replace(
              '            guiSessions = new GuiSessionService();\n',
              '            guiSessions = new GuiSessionService();\n            simulations = new CrateSimulationService();\n')
          marker = '            getServer().getPluginManager().registerEvents(menus, this);\n'
          replacement = marker + '            getServer().getPluginManager().registerEvents(new SimulationAdminListener(this, simulations), this);\n            getServer().getPluginManager().registerEvents(new PlayerCrateCommandRouter(this), this);\n'
          if marker not in text:
              raise SystemExit('PlexonCrates listener registration marker changed unexpectedly')
          text = text.replace(marker, replacement, 1)
          marker = '        if (guiSessions != null) guiSessions.clear();\n'
          replacement = marker + '        if (simulations != null) simulations.close();\n'
          if marker not in text:
              raise SystemExit('PlexonCrates disable marker changed unexpectedly')
          text = text.replace(marker, replacement, 1)
          main.write_text(text)

          test = Path('src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java')
          text = test.read_text()
          text = text.replace(
              '    private static final Path SESSION = Path.of("src/main/java/com/antondev/crates/gui/GuiSessionService.java");\n',
              '    private static final Path SESSION = Path.of("src/main/java/com/antondev/crates/gui/GuiSessionService.java");\n    private static final Path MAIN = Path.of("src/main/java/com/antondev/crates/PlexonCrates.java");\n')
          old = '''    @Test void playerUxReusesExistingGuiSessionAuthority() throws IOException {
              String session = Files.readString(SESSION);
              String holder = Files.readString(HOLDER);
              assertTrue(session.contains("new PlayerCrateCommandRouter(plugin)"));
              assertTrue(holder.contains("PLAYER_HALL"));
              assertTrue(session.contains("ConcurrentHashMap<UUID, Active> active"));
              assertFalse(Files.readString(UX).contains("new GuiSessionService"));
          }
          '''.replace('          ', '')
          new = '''    @Test void playerUxReusesExistingGuiSessionAuthority() throws IOException {
              String session = Files.readString(SESSION);
              String holder = Files.readString(HOLDER);
              String main = Files.readString(MAIN);
              assertTrue(holder.contains("PLAYER_HALL"));
              assertTrue(session.contains("ConcurrentHashMap<UUID, Active> active"));
              assertFalse(session.contains("registerEvents"));
              assertFalse(session.contains("PlayerCrateCommandRouter"));
              assertTrue(main.contains("registerEvents(new PlayerCrateCommandRouter(this), this)"));
              assertTrue(main.contains("registerEvents(new SimulationAdminListener(this, simulations), this)"));
              assertTrue(main.contains("if (simulations != null) simulations.close()"));
              assertFalse(Files.readString(UX).contains("new GuiSessionService"));
          }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('Architecture test block changed unexpectedly')
          test.write_text(text.replace(old, new))
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/revamp-compose.yml
          git add src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/gui/GuiSessionService.java \
                  src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "refactor: make GUI runtime composition explicit"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
