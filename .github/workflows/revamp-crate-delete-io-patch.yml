name: Revamp asynchronous crate deletion boundary
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-crate-delete-io-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply live crate deletion IO boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          source = registry.read_text()
          activation_record = '''    public record PreparedDraftActivation(String crateId, Crate crate, byte[] payload, Path file) {\n        public PreparedDraftActivation {\n            crateId = java.util.Objects.requireNonNull(crateId, "crateId");\n            crate = java.util.Objects.requireNonNull(crate, "crate");\n            payload = java.util.Objects.requireNonNull(payload, "payload").clone();\n            file = java.util.Objects.requireNonNull(file, "file");\n        }\n        @Override public byte[] payload() { return payload.clone(); }\n    }\n\n'''
          records = activation_record + '''    public record PreparedDeletion(String crateId, Crate crate, Path file) {\n        public PreparedDeletion {\n            crateId = java.util.Objects.requireNonNull(crateId, "crateId");\n            crate = java.util.Objects.requireNonNull(crate, "crate");\n            file = java.util.Objects.requireNonNull(file, "file");\n        }\n    }\n\n'''
          if activation_record not in source:
              raise SystemExit('PreparedDraftActivation anchor not found')
          source = source.replace(activation_record, records, 1)

          old_delete = '''    public void delete(String crateId) throws Exception {\n        String id = normalize(crateId);\n        Path file = files.get(id);\n        if (file == null) throw new IllegalArgumentException("Unknown crate");\n        Crate deleted = crates.get(id);\n        Files.deleteIfExists(file);\n        var nextCrates = new LinkedHashMap<>(crates);\n        var nextFiles = new LinkedHashMap<>(files);\n        nextCrates.remove(id);\n        nextFiles.remove(id);\n        crates = Collections.unmodifiableMap(nextCrates);\n        files = Collections.unmodifiableMap(nextFiles);\n        payloads.remove(id);\n        fireChange(deleted, CrateDefinitionChangeEvent.ChangeType.DELETED);\n    }\n'''
          new_delete = '''    public PreparedDeletion prepareDeletion(String crateId) {\n        String id = normalize(crateId);\n        Path file = files.get(id);\n        Crate crate = crates.get(id);\n        if (file == null || crate == null) throw new IllegalArgumentException("Unknown crate");\n        return new PreparedDeletion(id, crate, file);\n    }\n\n    /** Filesystem-only stage. Safe to execute on the bounded plugin I/O pool. */\n    public void deleteMirror(PreparedDeletion prepared) throws IOException {\n        java.util.Objects.requireNonNull(prepared, "prepared");\n        Files.deleteIfExists(prepared.file());\n    }\n\n    /** Applies a deletion after its mirror/canonical persistence stages have completed. */\n    public void installDeletion(PreparedDeletion prepared) {\n        java.util.Objects.requireNonNull(prepared, "prepared");\n        String id = prepared.crateId();\n        Path currentFile = files.get(id);\n        Crate current = crates.get(id);\n        if (currentFile == null || current == null) throw new IllegalArgumentException("Unknown crate");\n        if (!currentFile.equals(prepared.file()) || current != prepared.crate()) {\n            throw new IllegalStateException("Crate changed before deletion activation: " + id);\n        }\n        var nextCrates = new LinkedHashMap<>(crates);\n        var nextFiles = new LinkedHashMap<>(files);\n        nextCrates.remove(id);\n        nextFiles.remove(id);\n        crates = Collections.unmodifiableMap(nextCrates);\n        files = Collections.unmodifiableMap(nextFiles);\n        payloads.remove(id);\n        fireChange(current, CrateDefinitionChangeEvent.ChangeType.DELETED);\n    }\n\n    /** Synchronous compatibility API retained for tests/offline tooling. */\n    public void delete(String crateId) throws Exception {\n        PreparedDeletion prepared = prepareDeletion(crateId);\n        deleteMirror(prepared);\n        installDeletion(prepared);\n    }\n'''
          if old_delete not in source:
              raise SystemExit('CrateRegistry.delete anchor not found')
          registry.write_text(source.replace(old_delete, new_delete, 1))

          service = Path('src/main/java/com/antondev/crates/service/CrateDeletionService.java')
          service.write_text('''package com.antondev.crates.service;\n\nimport com.antondev.crates.PlexonCrates;\nimport com.antondev.crates.database.DatabaseService;\nimport java.time.Instant;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.CompletableFuture;\nimport org.bukkit.Bukkit;\n\n/** Confirmed crate deletion sequence: draft -> mirror -> canonical store -> primary activation. */\npublic final class CrateDeletionService {\n    private final PlexonCrates plugin;\n\n    public CrateDeletionService(PlexonCrates plugin) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n    }\n\n    public CompletableFuture<DatabaseService.DeleteResult> delete(\n            UUID actorId, String actorName, String crateId) {\n        Objects.requireNonNull(actorId, "actorId");\n        String actor = Objects.requireNonNull(actorName, "actorName");\n        if (!Bukkit.isPrimaryThread()) {\n            return CompletableFuture.failedFuture(\n                    new IllegalStateException("Crate deletion must be requested on the primary thread"));\n        }\n        CrateRegistry.PreparedDeletion prepared;\n        try {\n            prepared = plugin.crates().prepareDeletion(crateId);\n        } catch (Exception error) {\n            return CompletableFuture.failedFuture(error);\n        }\n        return plugin.draftSessions().discardCrate(actorId, prepared.crateId())\n                .thenCompose(ignored -> plugin.io().run(() -> plugin.crates().deleteMirror(prepared)))\n                .thenCompose(ignored -> plugin.definitionRepository()\n                        .delete(prepared.crateId(), actorId, actor))\n                .thenCompose(deleted -> primary(() -> {\n                    plugin.runtime().remove(deleted.runtimeRevision(), deleted.definitionRevision(), prepared.crateId());\n                    plugin.forgetDefinitionRevision(prepared.crateId());\n                    plugin.crates().installDeletion(prepared);\n                    if (!deleted.removed()) {\n                        plugin.database().audit(new DatabaseService.AuditRecord(actorId, actor, "DELETE", "CRATE",\n                                prepared.crateId(), "Deleted confirmed unpublished crate definition", Instant.now()));\n                    }\n                    return deleted;\n                }));\n    }\n\n    private <T> CompletableFuture<T> primary(Callable<T> task) {\n        if (Bukkit.isPrimaryThread()) {\n            try {\n                return CompletableFuture.completedFuture(task.call());\n            } catch (Exception error) {\n                return CompletableFuture.failedFuture(error);\n            }\n        }\n        CompletableFuture<T> future = new CompletableFuture<>();\n        try {\n            Bukkit.getScheduler().runTask(plugin, () -> {\n                try { future.complete(task.call()); }\n                catch (Exception error) { future.completeExceptionally(error); }\n            });\n        } catch (RuntimeException error) {\n            future.completeExceptionally(error);\n        }\n        return future;\n    }\n}\n''')

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          source = main.read_text()
          source = source.replace('import com.antondev.crates.service.CrateDraftCreationService;\n',
                                  'import com.antondev.crates.service.CrateDraftCreationService;\nimport com.antondev.crates.service.CrateDeletionService;\n', 1)
          source = source.replace('    private CrateDraftCreationService draftCreation;\n',
                                  '    private CrateDraftCreationService draftCreation;\n    private CrateDeletionService crateDeletions;\n', 1)
          source = source.replace('            draftCreation = new CrateDraftCreationService(this);\n            crateTransfers =',
                                  '            draftCreation = new CrateDraftCreationService(this);\n            crateDeletions = new CrateDeletionService(this);\n            crateTransfers =', 1)
          source = source.replace('    public CrateDraftCreationService draftCreation() { return draftCreation; }\n',
                                  '    public CrateDraftCreationService draftCreation() { return draftCreation; }\n    public CrateDeletionService crateDeletions() { return crateDeletions; }\n', 1)
          main.write_text(source)

          admin = Path('src/main/java/com/antondev/crates/gui/AdminMenuService.java')
          source = admin.read_text()
          old = '''        plugin.draftSessions().discardCrate(player.getUniqueId(), crateId)\n                .whenComplete((ignored, error) -> runFor(player.getUniqueId(), target -> {\n                    if (error != null) {\n                        plugin.configError(target, asException(error));\n                        return;\n                    }\n                    plugin.definitionRepository().delete(crateId, target.getUniqueId(), target.getName())\n                            .whenComplete((deleted, deleteError) -> runFor(target.getUniqueId(), current -> {\n                                if (deleteError != null) {\n                                    plugin.configError(current, asException(deleteError));\n                                    return;\n                                }\n                                try {\n                                    plugin.runtime().remove(deleted.runtimeRevision(), deleted.definitionRevision(), crateId);\n                                    plugin.forgetDefinitionRevision(crateId);\n                                    plugin.crates().delete(crateId);\n                                    if (!deleted.removed()) {\n                                        plugin.database().audit(new DatabaseService.AuditRecord(current.getUniqueId(),\n                                                current.getName(), "DELETE", "CRATE", crateId,\n                                                "Deleted confirmed unpublished crate definition", Instant.now()));\n                                    }\n                                    openCrates(current, 0);\n                                } catch (Exception deleteErrorAfterCommit) {\n                                    plugin.configError(current, deleteErrorAfterCommit);\n                                }\n                            }));\n                }));\n'''
          new = '''        plugin.crateDeletions().delete(player.getUniqueId(), player.getName(), crateId)\n                .whenComplete((deleted, error) -> runFor(player.getUniqueId(), target -> {\n                    if (error != null) plugin.configError(target, asException(error));\n                    else openCrates(target, 0);\n                }));\n'''
          if old not in source:
              raise SystemExit('Admin crate deletion flow anchor not found')
          admin.write_text(source.replace(old, new, 1))
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-crate-delete-io-patch.yml
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java \
                  src/main/java/com/antondev/crates/service/CrateDeletionService.java \
                  src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/gui/AdminMenuService.java
          git commit -m 'perf: move confirmed crate deletion IO off the server thread'
          git push origin HEAD:revamp/5.1.0-full-source-hardening
