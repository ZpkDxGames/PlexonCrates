name: Revamp crate import IO boundary patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-crate-import-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply crate import boundary patch
        run: python tools/revamp_patch_crate_import_boundary.py
      - name: Commit source patch and remove temporary helpers
        run: |
          git rm .github/workflows/revamp-crate-import-boundary-patch.yml tools/revamp_patch_crate_import_boundary.py
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "refactor: split crate import preparation IO and activation"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
