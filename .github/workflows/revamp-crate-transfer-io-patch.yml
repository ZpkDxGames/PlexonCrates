name: Revamp asynchronous crate transfer boundary
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-crate-transfer-io-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply live crate transfer IO boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          source = registry.read_text()
          import_record = '''    public record PreparedDraftImport(String crateId, Crate crate, byte[] payload, Path file) {\n        public PreparedDraftImport {\n            crateId = java.util.Objects.requireNonNull(crateId, "crateId");\n            crate = java.util.Objects.requireNonNull(crate, "crate");\n            payload = java.util.Objects.requireNonNull(payload, "payload").clone();\n            file = java.util.Objects.requireNonNull(file, "file");\n        }\n        @Override public byte[] payload() { return payload.clone(); }\n    }\n\n'''
          export_record = import_record + '''    public record PreparedExport(Path destination, String payload) {\n        public PreparedExport {\n            destination = java.util.Objects.requireNonNull(destination, "destination");\n            payload = java.util.Objects.requireNonNull(payload, "payload");\n        }\n    }\n\n'''
          if import_record not in source:
              raise SystemExit('PreparedDraftImport record anchor not found')
          source = source.replace(import_record, export_record, 1)

          anchor = '''    public void writeImportedDraft(PreparedDraftImport prepared) throws IOException {\n        AtomicFiles.write(prepared.file(), new String(prepared.payload(), StandardCharsets.UTF_8));\n    }\n\n'''
          addition = anchor + '''    public PreparedDraftActivation prepareImportedActivation(\n            String sourceYaml, String rawNewId, String editor) throws Exception {\n        PreparedDraftImport prepared = prepareImportedDraft(sourceYaml, rawNewId, editor);\n        return new PreparedDraftActivation(prepared.crateId(), prepared.crate(), prepared.payload(), prepared.file());\n    }\n\n'''
          if anchor not in source:
              raise SystemExit('writeImportedDraft anchor not found')
          source = source.replace(anchor, addition, 1)

          old_export = '''    public Path exportDefinition(String crateId, Path exportDirectory) throws Exception {\n        String id = normalize(crateId);\n        Path source = files.get(id);\n        if (source == null) throw new IllegalArgumentException("Unknown crate");\n        Path root = exportDirectory.toAbsolutePath().normalize();\n        Files.createDirectories(root);\n        Path destination = root.resolve(id + ".yml").normalize();\n        if (!destination.getParent().equals(root)) throw new IllegalArgumentException("Invalid export path");\n        AtomicFiles.write(destination, serialized(id));\n        return destination;\n    }\n'''
          new_export = '''    public PreparedExport prepareExport(String crateId, Path exportDirectory) {\n        String id = normalize(crateId);\n        if (!files.containsKey(id)) throw new IllegalArgumentException("Unknown crate");\n        byte[] payload = payloads.get(id);\n        if (payload == null) throw new IllegalStateException("Crate payload is unavailable for export");\n        Path root = exportDirectory.toAbsolutePath().normalize();\n        Path destination = root.resolve(id + ".yml").normalize();\n        if (!destination.getParent().equals(root)) throw new IllegalArgumentException("Invalid export path");\n        return new PreparedExport(destination, new String(payload, StandardCharsets.UTF_8));\n    }\n\n    public Path writeExport(PreparedExport prepared) throws Exception {\n        Files.createDirectories(prepared.destination().getParent());\n        AtomicFiles.write(prepared.destination(), prepared.payload());\n        return prepared.destination();\n    }\n\n    /** Synchronous compatibility API retained for tests/offline tooling. */\n    public Path exportDefinition(String crateId, Path exportDirectory) throws Exception {\n        return writeExport(prepareExport(crateId, exportDirectory));\n    }\n'''
          if source.count(old_export) != 1:
              raise SystemExit(f'Expected one exportDefinition body, found {source.count(old_export)}')
          registry.write_text(source.replace(old_export, new_export, 1))

          creation = Path('src/main/java/com/antondev/crates/service/CrateDraftCreationService.java')
          source = creation.read_text()
          source = source.replace('    private CompletableFuture<Crate> activate(UUID actorId, String actorName,\n',
                                  '    CompletableFuture<Crate> activatePrepared(UUID actorId, String actorName,\n                                               CrateRegistry.PreparedDraftActivation candidate) {\n        return activate(actorId, actorName, candidate);\n    }\n\n    private CompletableFuture<Crate> activate(UUID actorId, String actorName,\n', 1)
          creation.write_text(source)

          transfer = Path('src/main/java/com/antondev/crates/service/CrateTransferService.java')
          transfer.write_text('''package com.antondev.crates.service;\n\nimport com.antondev.crates.PlexonCrates;\nimport com.antondev.crates.model.Crate;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.CompletableFuture;\nimport org.bukkit.Bukkit;\n\n/** Live administrator crate import/export boundary with bounded filesystem I/O. */\npublic final class CrateTransferService {\n    private final PlexonCrates plugin;\n\n    public CrateTransferService(PlexonCrates plugin) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n    }\n\n    public CompletableFuture<Crate> importDraft(\n            UUID actorId, String actorName, Path sourceFile, String newId) {\n        Path source = sourceFile.toAbsolutePath().normalize();\n        return plugin.io().submit(() -> {\n            if (!Files.isRegularFile(source) || !source.getFileName().toString().endsWith(".yml")) {\n                throw new IllegalArgumentException("Import source must be an existing .yml file");\n            }\n            return Files.readString(source, StandardCharsets.UTF_8);\n        }).thenCompose(sourceYaml -> primary(() ->\n                plugin.crates().prepareImportedActivation(sourceYaml, newId, actorName)))\n                .thenCompose(prepared -> plugin.draftCreation()\n                        .activatePrepared(actorId, actorName, prepared));\n    }\n\n    public CompletableFuture<Path> export(String crateId, Path exportDirectory) {\n        try {\n            requirePrimary();\n            CrateRegistry.PreparedExport prepared = plugin.crates().prepareExport(crateId, exportDirectory);\n            return plugin.io().submit(() -> plugin.crates().writeExport(prepared));\n        } catch (Exception error) {\n            return CompletableFuture.failedFuture(error);\n        }\n    }\n\n    private <T> CompletableFuture<T> primary(Callable<T> task) {\n        if (Bukkit.isPrimaryThread()) {\n            try {\n                return CompletableFuture.completedFuture(task.call());\n            } catch (Exception error) {\n                return CompletableFuture.failedFuture(error);\n            }\n        }\n        CompletableFuture<T> future = new CompletableFuture<>();\n        Bukkit.getScheduler().runTask(plugin, () -> {\n            try {\n                future.complete(task.call());\n            } catch (Exception error) {\n                future.completeExceptionally(error);\n            }\n        });\n        return future;\n    }\n\n    private static void requirePrimary() {\n        if (!Bukkit.isPrimaryThread()) {\n            throw new IllegalStateException("Crate export preparation requires the primary thread");\n        }\n    }\n}\n''')

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          source = main.read_text()
          source = source.replace('import com.antondev.crates.service.CrateDraftCreationService;\n',
                                  'import com.antondev.crates.service.CrateDraftCreationService;\nimport com.antondev.crates.service.CrateTransferService;\n', 1)
          source = source.replace('    private CrateDraftCreationService draftCreation;\n',
                                  '    private CrateDraftCreationService draftCreation;\n    private CrateTransferService crateTransfers;\n', 1)
          source = source.replace('            draftCreation = new CrateDraftCreationService(this);\n            definitionPublisher =',
                                  '            draftCreation = new CrateDraftCreationService(this);\n            crateTransfers = new CrateTransferService(this);\n            definitionPublisher =', 1)
          source = source.replace('    public CrateDraftCreationService draftCreation() { return draftCreation; }\n',
                                  '    public CrateDraftCreationService draftCreation() { return draftCreation; }\n    public CrateTransferService crateTransfers() { return crateTransfers; }\n', 1)
          main.write_text(source)

          command = Path('src/main/java/com/antondev/crates/command/CratesAdminCommand.java')
          source = command.read_text()
          old_import = '''    private void importCrate(CommandSender sender, String[] args) throws Exception {\n        if (args.length < 3) { help(sender); return; }\n        String fileName = args[1];\n        if (!safeYamlName(fileName)) throw new IllegalArgumentException("Import filename must be a simple .yml name");\n        Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n        Path source = root.resolve(fileName).normalize();\n        if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports directory");\n        Crate imported = plugin.crates().importAsDraft(source, args[2], sender.getName());\n        registerDraft(sender, imported);\n        if (sender instanceof Player player) plugin.menus().openEditor(player, imported);\n        else sender.sendMessage(Text.parse("<green>Imported crate draft:</green> <white>" + imported.id() + "</white>"));\n    }\n'''
          new_import = '''    private void importCrate(CommandSender sender, String[] args) {\n        if (args.length < 3) { help(sender); return; }\n        String fileName = args[1];\n        if (!safeYamlName(fileName)) throw new IllegalArgumentException("Import filename must be a simple .yml name");\n        Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n        Path source = root.resolve(fileName).normalize();\n        if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports directory");\n        plugin.crateTransfers().importDraft(actorId(sender), sender.getName(), source, args[2])\n                .whenComplete((imported, error) -> runSync(() -> {\n                    if (error != null) plugin.configError(sender, asException(error));\n                    else if (sender instanceof Player player) {\n                        if (player.isOnline()) plugin.menus().openEditor(player, imported);\n                    } else sender.sendMessage(Text.parse("<green>Imported crate draft:</green> <white>"\n                            + imported.id() + "</white>"));\n                }));\n    }\n'''
          if old_import not in source:
              raise SystemExit('command import anchor not found')
          source = source.replace(old_import, new_import, 1)
          old_export_cmd = '''    private void exportCrate(CommandSender sender, String[] args) throws Exception {\n        Crate crate = crate(sender, args, 1);\n        if (crate == null) return;\n        Path destination = plugin.crates().exportDefinition(crate.id(),\n                plugin.getDataFolder().toPath().resolve("exports"));\n        sender.sendMessage(Text.parse("<green>Exported</green> <white>" + crate.id()\n                + "</white> <green>to</green> <white>exports/" + destination.getFileName() + "</white><green>.</green>"));\n    }\n'''
          new_export_cmd = '''    private void exportCrate(CommandSender sender, String[] args) {\n        Crate crate = crate(sender, args, 1);\n        if (crate == null) return;\n        plugin.crateTransfers().export(crate.id(), plugin.getDataFolder().toPath().resolve("exports"))\n                .whenComplete((destination, error) -> runSync(() -> {\n                    if (error != null) plugin.configError(sender, asException(error));\n                    else sender.sendMessage(Text.parse("<green>Exported</green> <white>" + crate.id()\n                            + "</white> <green>to</green> <white>exports/" + destination.getFileName()\n                            + "</white><green>.</green>"));\n                }));\n    }\n'''
          if old_export_cmd not in source:
              raise SystemExit('command export anchor not found')
          command.write_text(source.replace(old_export_cmd, new_export_cmd, 1))

          admin = Path('src/main/java/com/antondev/crates/gui/AdminMenuService.java')
          source = admin.read_text()
          old_gui_import = '''            Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n            Path source = root.resolve(fileName).normalize();\n            if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports folder");\n            Crate imported = plugin.crates().importAsDraft(source, parts[1].trim(), target.getName());\n            openCrateEditor(target, imported);\n'''
          new_gui_import = '''            Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n            Path source = root.resolve(fileName).normalize();\n            if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports folder");\n            plugin.crateTransfers().importDraft(target.getUniqueId(), target.getName(), source, parts[1].trim())\n                    .whenComplete((imported, error) -> runFor(target.getUniqueId(), current -> {\n                        if (error != null) plugin.configError(current, asException(error));\n                        else openCrateEditor(current, imported);\n                    }));\n'''
          if old_gui_import not in source:
              raise SystemExit('GUI import anchor not found')
          source = source.replace(old_gui_import, new_gui_import, 1)
          old_gui_export = '''    private void exportCrate(Player player, String crateId, int page) throws Exception {\n        Path destination = plugin.crates().exportDefinition(crateId,\n                plugin.getDataFolder().toPath().resolve("exports"));\n        player.sendMessage(Text.parse("<green>Exported</green> <white>" + crateId\n                + "</white> <green>to</green> <white>exports/" + destination.getFileName() + "</white><green>.</green>"));\n        openCrates(player, page);\n    }\n'''
          new_gui_export = '''    private void exportCrate(Player player, String crateId, int page) {\n        plugin.crateTransfers().export(crateId, plugin.getDataFolder().toPath().resolve("exports"))\n                .whenComplete((destination, error) -> runFor(player.getUniqueId(), current -> {\n                    if (error != null) plugin.configError(current, asException(error));\n                    else current.sendMessage(Text.parse("<green>Exported</green> <white>" + crateId\n                            + "</white> <green>to</green> <white>exports/" + destination.getFileName()\n                            + "</white><green>.</green>"));\n                    openCrates(current, page);\n                }));\n    }\n'''
          if old_gui_export not in source:
              raise SystemExit('GUI export anchor not found')
          admin.write_text(source.replace(old_gui_export, new_gui_export, 1))
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-crate-transfer-io-patch.yml
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java \
                  src/main/java/com/antondev/crates/service/CrateDraftCreationService.java \
                  src/main/java/com/antondev/crates/service/CrateTransferService.java \
                  src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/command/CratesAdminCommand.java \
                  src/main/java/com/antondev/crates/gui/AdminMenuService.java
          git commit -m 'perf: move live crate transfer IO off the server thread'
          git push origin HEAD:revamp/5.1.0-full-source-hardening