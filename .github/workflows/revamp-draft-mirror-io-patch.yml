name: Revamp ordered async draft mirror writes
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-draft-mirror-io-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply ordered async draft mirror boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          source = registry.read_text()

          source = source.replace(
              'import java.util.UUID;\nimport java.util.regex.Pattern;\n',
              'import java.util.UUID;\nimport java.util.concurrent.CompletableFuture;\nimport java.util.logging.Level;\nimport java.util.logging.Logger;\nimport java.util.regex.Pattern;\n', 1)

          old_fields = '''    private final Path directory;\n    private Map<String, Crate> crates;\n    private Map<String, Path> files;\n    private Map<String, byte[]> payloads;\n'''
          new_fields = '''    private final Path directory;\n    private Map<String, Crate> crates;\n    private Map<String, Path> files;\n    private Map<String, byte[]> payloads;\n    private final Map<Path, CompletableFuture<Void>> mirrorWrites = new LinkedHashMap<>();\n    private AsyncIoService mirrorIo;\n    private Logger mirrorLogger;\n'''
          if old_fields not in source:
              raise SystemExit('CrateRegistry field anchor not found')
          source = source.replace(old_fields, new_fields, 1)

          constructor_anchor = '''    public CrateRegistry(Path directory, Snapshot snapshot) {\n        this.directory = directory.toAbsolutePath().normalize();\n        apply(snapshot);\n    }\n\n'''
          writer_api = '''    public CrateRegistry(Path directory, Snapshot snapshot) {\n        this.directory = directory.toAbsolutePath().normalize();\n        apply(snapshot);\n    }\n\n    /**\n     * Enables ordered asynchronous writes for non-authoritative editable YAML mirrors.\n     * Standalone/test registries retain synchronous writes until this is configured.\n     */\n    public void configureMirrorWriter(AsyncIoService io, Logger logger) {\n        mirrorIo = java.util.Objects.requireNonNull(io, "io");\n        mirrorLogger = java.util.Objects.requireNonNull(logger, "logger");\n    }\n\n    /** Returns a future covering every mirror write queued before this call. */\n    public CompletableFuture<Void> awaitMirrorWrites() {\n        synchronized (mirrorWrites) {\n            if (mirrorWrites.isEmpty()) return CompletableFuture.completedFuture(null);\n            return CompletableFuture.allOf(mirrorWrites.values().toArray(CompletableFuture[]::new));\n        }\n    }\n\n    private void persistEditableMirror(Path file, String serialized) throws IOException {\n        AsyncIoService io = mirrorIo;\n        if (io == null) {\n            AtomicFiles.write(file, serialized);\n            return;\n        }\n        Path path = file.toAbsolutePath().normalize();\n        CompletableFuture<Void> next;\n        synchronized (mirrorWrites) {\n            CompletableFuture<Void> previous = mirrorWrites.get(path);\n            CompletableFuture<Void> ready = previous == null\n                    ? CompletableFuture.completedFuture(null)\n                    : previous.handle((ignored, failure) -> null);\n            next = ready.thenCompose(ignored -> io.run(() -> AtomicFiles.write(path, serialized)));\n            mirrorWrites.put(path, next);\n        }\n        next.whenComplete((ignored, failure) -> {\n            synchronized (mirrorWrites) {\n                if (mirrorWrites.get(path) == next) mirrorWrites.remove(path);\n            }\n            if (failure != null && mirrorLogger != null) {\n                mirrorLogger.log(Level.SEVERE,\n                        "Could not update editable crate YAML mirror " + path.getFileName(), failure);\n            }\n        });\n    }\n\n'''
          if constructor_anchor not in source:
              raise SystemExit('CrateRegistry constructor anchor not found')
          source = source.replace(constructor_anchor, writer_api, 1)

          old_mutate = '''        Crate parsed = parse(file, yaml);\n        String serialized = yaml.saveToString();\n        AtomicFiles.write(file, serialized);\n        install(id, file, parsed);\n        payloads.put(id, serialized.getBytes(StandardCharsets.UTF_8));\n        fireChange(parsed, changeType(previous, parsed));\n    }\n'''
          new_mutate = '''        Crate parsed = parse(file, yaml);\n        String serialized = yaml.saveToString();\n        persistEditableMirror(file, serialized);\n        install(id, file, parsed);\n        payloads.put(id, serialized.getBytes(StandardCharsets.UTF_8));\n        fireChange(parsed, changeType(previous, parsed));\n    }\n'''
          count = source.count(old_mutate)
          if count != 1:
              raise SystemExit(f'Expected exactly one generic mutate body, found {count}')
          source = source.replace(old_mutate, new_mutate, 1)
          registry.write_text(source)

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          source = main.read_text()
          configure_anchor = '''            if (canonical.definitions().isEmpty() && !durableDrafts.isEmpty()) {\n                crates.apply(CrateRegistry.withDurableDrafts(getDataFolder().toPath().resolve("crates"),\n                        crates.snapshot(), durableDrafts));\n            }\n            statistics = new StatsStore(database.loadStatistics());\n'''
          configure_replacement = '''            if (canonical.definitions().isEmpty() && !durableDrafts.isEmpty()) {\n                crates.apply(CrateRegistry.withDurableDrafts(getDataFolder().toPath().resolve("crates"),\n                        crates.snapshot(), durableDrafts));\n            }\n            crates.configureMirrorWriter(io, getLogger());\n            statistics = new StatsStore(database.loadStatistics());\n'''
          if configure_anchor not in source:
              raise SystemExit('PlexonCrates mirror writer configuration anchor not found')
          source = source.replace(configure_anchor, configure_replacement, 1)

          shutdown_anchor = '''        if (openingLog != null) openingLog.close();\n        if (io != null) io.close();\n        if (database != null) database.close();\n'''
          shutdown_replacement = '''        if (openingLog != null) openingLog.close();\n        if (crates != null) {\n            try {\n                crates.awaitMirrorWrites().get(3, java.util.concurrent.TimeUnit.SECONDS);\n            } catch (Exception error) {\n                getLogger().log(Level.WARNING, "Not every queued crate YAML mirror write finished before shutdown", error);\n            }\n        }\n        if (io != null) io.close();\n        if (database != null) database.close();\n'''
          if shutdown_anchor not in source:
              raise SystemExit('PlexonCrates shutdown anchor not found')
          source = source.replace(shutdown_anchor, shutdown_replacement, 1)
          main.write_text(source)
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-draft-mirror-io-patch.yml
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java src/main/java/com/antondev/crates/PlexonCrates.java
          git commit -m 'perf: queue editable crate mirror writes off the server thread'
          git push origin HEAD:revamp/5.1.0-full-source-hardening