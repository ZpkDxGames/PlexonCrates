name: Revamp durable create UX fix
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-durable-create-ux-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Preserve crate list while durable create completes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('src/main/java/com/antondev/crates/gui/AdminMenuService.java')
          source = admin.read_text()
          old = '''        if (kind == MenuHolder.Kind.CRATE_LIST) {\n            player.closeInventory();\n            plugin.draftCreation().createQuick(player.getUniqueId(), player.getName())\n'''
          new = '''        if (kind == MenuHolder.Kind.CRATE_LIST) {\n            plugin.draftCreation().createQuick(player.getUniqueId(), player.getName())\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one quick-create close block, found {source.count(old)}')
          admin.write_text(source.replace(old, new, 1))

          test = Path('src/test/java/com/antondev/crates/AdministrationIntegrationTest.java')
          source = test.read_text()
          old = '''        player.simulateInventoryClick(player.getOpenInventory(), ClickType.LEFT,\n                plugin.menusConfig().slot("crate-list.create"));\n\n        MenuHolder holder = (MenuHolder) player.getOpenInventory().getTopInventory().getHolder();\n'''
          new = '''        player.simulateInventoryClick(player.getOpenInventory(), ClickType.LEFT,\n                plugin.menusConfig().slot("crate-list.create"));\n\n        // New drafts are durable-first: keep the crate list visible while SQLite establishes\n        // the writable draft, then transition to the editor on the primary thread.\n        plugin.database().awaitIdle().join();\n        server.getScheduler().performTicks(2);\n\n        MenuHolder holder = (MenuHolder) player.getOpenInventory().getTopInventory().getHolder();\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one quick-create test block, found {source.count(old)}')
          test.write_text(source.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-durable-create-ux-fix.yml
          git add src/main/java/com/antondev/crates/gui/AdminMenuService.java src/test/java/com/antondev/crates/AdministrationIntegrationTest.java
          git commit -m 'fix: preserve GUI while durable crate creation completes'
          git push origin HEAD:revamp/5.1.0-full-source-hardening