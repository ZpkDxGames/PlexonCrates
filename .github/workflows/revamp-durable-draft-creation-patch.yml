name: Revamp durable-first crate draft creation
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-durable-draft-creation-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply durable-first draft creation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          source = registry.read_text()
          record_anchor = '''    public record PreparedDraftImport(String crateId, Crate crate, byte[] payload, Path file) {\n        public PreparedDraftImport {\n            crateId = java.util.Objects.requireNonNull(crateId, "crateId");\n            crate = java.util.Objects.requireNonNull(crate, "crate");\n            payload = java.util.Objects.requireNonNull(payload, "payload").clone();\n            file = java.util.Objects.requireNonNull(file, "file");\n        }\n        @Override public byte[] payload() { return payload.clone(); }\n    }\n\n'''
          record_replacement = record_anchor + '''    public record PreparedDraftActivation(String crateId, Crate crate, byte[] payload, Path file) {\n        public PreparedDraftActivation {\n            crateId = java.util.Objects.requireNonNull(crateId, "crateId");\n            crate = java.util.Objects.requireNonNull(crate, "crate");\n            payload = java.util.Objects.requireNonNull(payload, "payload").clone();\n            file = java.util.Objects.requireNonNull(file, "file");\n        }\n        @Override public byte[] payload() { return payload.clone(); }\n    }\n\n'''
          if record_anchor not in source:
              raise SystemExit('PreparedDraftImport anchor not found')
          source = source.replace(record_anchor, record_replacement, 1)

          start = source.index('    public Crate createDraft(String rawId, String editor) throws Exception {')
          end = source.index('    public PreparedDraftImport prepareImportedDraft(', start)
          replacement = '''    public PreparedDraftActivation prepareNewDraft(String rawId, String editor) throws Exception {\n        return prepareNewDraft(rawId, editor, null);\n    }\n\n    /** Creates the normal GUI draft candidate without touching disk or live registry state. */\n    public PreparedDraftActivation prepareQuickDraft(String editor) throws Exception {\n        String id;\n        do {\n            id = "crate_" + UUID.randomUUID().toString().replace("-", "").substring(0, 8);\n        } while (crates.containsKey(id));\n        return prepareNewDraft(id, editor, "New Crate");\n    }\n\n    private PreparedDraftActivation prepareNewDraft(String rawId, String editor, String requestedDisplayName) throws Exception {\n        String id = normalize(rawId);\n        if (!validId(id)) throw new IllegalArgumentException("Invalid crate ID");\n        if (crates.containsKey(id)) throw new IllegalArgumentException("Crate already exists");\n        Path file = directory.resolve(id + ".yml").normalize();\n        if (!file.getParent().equals(directory.normalize())) throw new IllegalArgumentException("Invalid crate path");\n        String defaultName = requestedDisplayName == null ? pretty(id) + " Crate" : requestedDisplayName;\n        Instant now = Instant.now();\n        YamlConfiguration yaml = new YamlConfiguration();\n        yaml.set("config-version", 3);\n        yaml.set("id", id);\n        yaml.set("state", "DRAFT");\n        yaml.set("display-order", nextDisplayOrder());\n        yaml.set("display-name", "<white><bold>" + defaultName + "</bold></white>");\n        yaml.set("description", List.of("<gray>A new crate draft.</gray>"));\n        yaml.set("icon.material", "CHEST");\n        yaml.set("icon.name", "<white><bold>" + defaultName + "</bold></white>");\n        yaml.set("icon.lore", List.of("<yellow>Draft — finish setup before publishing.</yellow>"));\n        yaml.set("access.permission", "");\n        yaml.set("access.worlds", List.of());\n        yaml.set("access.excluded-worlds", List.of());\n        yaml.set("keys.cost", 1);\n        yaml.set("keys.accepted", List.of());\n        yaml.set("keys.payment-policy", "PHYSICAL_ONLY");\n        yaml.set("keys.allow-mixed-payment", false);\n        yaml.set("opening.cooldown-seconds", 1);\n        yaml.set("opening.bulk-enabled", true);\n        yaml.set("opening.bulk-maximum", 64);\n        yaml.set("opening.mode", "RANDOM");\n        yaml.set("opening.animation", "ROULETTE");\n        yaml.set("opening.broadcast", "");\n        yaml.set("hologram.enabled", true);\n        yaml.set("hologram.lines", List.of("<white><bold>" + defaultName.toUpperCase(Locale.ROOT) + "</bold></white>",\n                "<gray>Left-click to preview</gray>", "<white>Right-click with its key</white>"));\n        yaml.set("pity.enabled", false);\n        yaml.set("pity.threshold", 0);\n        yaml.set("pity.reward-ids", List.of());\n        yaml.set("rerolls.enabled", false);\n        yaml.set("rerolls.maximum", 0);\n        yaml.set("rerolls.cost-type", RerollService.CostType.TOKEN.name());\n        yaml.set("rerolls.cost", 0);\n        yaml.set("rerolls.permission", "");\n        yaml.set("rerolls.exclude-previous", true);\n        yaml.set("rerolls.timeout-seconds", 15);\n        yaml.set("rerolls.timeout-policy", RerollService.TimeoutPolicy.ACCEPT_CURRENT.name());\n        yaml.set("rerolls.mass-allowed", false);\n        yaml.createSection("milestones");\n        yaml.createSection("rewards");\n        yaml.set("audit.created-at", now.toString());\n        yaml.set("audit.updated-at", now.toString());\n        yaml.set("audit.last-editor", editor);\n        Crate parsed = parse(file, yaml);\n        return new PreparedDraftActivation(id, parsed,\n                yaml.saveToString().getBytes(StandardCharsets.UTF_8), file);\n    }\n\n    public PreparedDraftActivation prepareCloneDraft(String sourceId, String rawNewId, String editor) throws Exception {\n        Crate sourceCrate = find(sourceId).orElseThrow(() -> new IllegalArgumentException("Unknown source crate"));\n        String newId = normalize(rawNewId);\n        if (!validId(newId) || crates.containsKey(newId)) {\n            throw new IllegalArgumentException("Invalid or existing new crate ID");\n        }\n        YamlConfiguration yaml = decode(serialized(sourceCrate.id()).getBytes(StandardCharsets.UTF_8));\n        yaml.set("id", newId);\n        yaml.set("state", "DRAFT");\n        yaml.set("display-order", nextDisplayOrder());\n        yaml.set("audit.created-at", Instant.now().toString());\n        yaml.set("audit.updated-at", Instant.now().toString());\n        yaml.set("audit.last-editor", editor);\n        Path file = directory.resolve(newId + ".yml").normalize();\n        if (!file.getParent().equals(directory.normalize())) throw new IllegalArgumentException("Invalid clone path");\n        Crate parsed = parse(file, yaml);\n        return new PreparedDraftActivation(newId, parsed,\n                yaml.saveToString().getBytes(StandardCharsets.UTF_8), file);\n    }\n\n    /** Parses the payload returned by the durable draft session before live activation. */\n    public PreparedDraftActivation prepareDurableDraft(String rawId, byte[] payload) throws Exception {\n        String id = normalize(rawId);\n        if (!validId(id) || crates.containsKey(id)) throw new IllegalArgumentException("Invalid or existing crate ID");\n        Path file = directory.resolve(id + ".yml").normalize();\n        if (!file.getParent().equals(directory.normalize())) throw new IllegalArgumentException("Invalid draft path");\n        YamlConfiguration yaml = decode(payload);\n        Crate parsed = parse(file, yaml);\n        if (!parsed.id().equals(id) || parsed.state() != CrateState.DRAFT) {\n            throw new IllegalArgumentException("Durable new-crate draft payload is invalid");\n        }\n        return new PreparedDraftActivation(id, parsed, payload, file);\n    }\n\n    public Crate installPreparedDraft(PreparedDraftActivation prepared) {\n        String id = prepared.crateId();\n        if (crates.containsKey(id)) throw new IllegalArgumentException("Draft crate ID became occupied: " + id);\n        install(id, prepared.file(), prepared.crate());\n        payloads.put(id, prepared.payload());\n        fireChange(prepared.crate(), CrateDefinitionChangeEvent.ChangeType.CREATED);\n        return prepared.crate();\n    }\n\n    public void queuePreparedDraftMirror(PreparedDraftActivation prepared) throws IOException {\n        persistEditableMirror(prepared.file(), new String(prepared.payload(), StandardCharsets.UTF_8));\n    }\n\n    /** Synchronous compatibility API retained for tests/offline tooling. */\n    public Crate createDraft(String rawId, String editor) throws Exception {\n        PreparedDraftActivation prepared = prepareNewDraft(rawId, editor);\n        AtomicFiles.write(prepared.file(), new String(prepared.payload(), StandardCharsets.UTF_8));\n        return installPreparedDraft(prepared);\n    }\n\n    /** Synchronous compatibility API retained for tests/offline tooling. */\n    public Crate createQuickDraft(String editor) throws Exception {\n        PreparedDraftActivation prepared = prepareQuickDraft(editor);\n        AtomicFiles.write(prepared.file(), new String(prepared.payload(), StandardCharsets.UTF_8));\n        return installPreparedDraft(prepared);\n    }\n\n    /** Synchronous compatibility API retained for tests/offline tooling. */\n    public Crate cloneAsDraft(String sourceId, String rawNewId, String editor) throws Exception {\n        PreparedDraftActivation prepared = prepareCloneDraft(sourceId, rawNewId, editor);\n        AtomicFiles.write(prepared.file(), new String(prepared.payload(), StandardCharsets.UTF_8));\n        return installPreparedDraft(prepared);\n    }\n\n'''
          source = source[:start] + replacement + source[end:]
          registry.write_text(source)

          coordinator = Path('src/main/java/com/antondev/crates/service/CrateDraftCreationService.java')
          coordinator.write_text('''package com.antondev.crates.service;\n\nimport com.antondev.crates.PlexonCrates;\nimport com.antondev.crates.model.Crate;\nimport java.util.Objects;\nimport java.util.UUID;\nimport java.util.concurrent.CompletableFuture;\nimport java.util.concurrent.Callable;\nimport org.bukkit.Bukkit;\n\n/** Durable-first coordinator for new and cloned administrator crate drafts. */\npublic final class CrateDraftCreationService {\n    private final PlexonCrates plugin;\n\n    public CrateDraftCreationService(PlexonCrates plugin) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n    }\n\n    public CompletableFuture<Crate> create(UUID actorId, String actorName, String crateId) {\n        try {\n            requirePrimary();\n            return activate(actorId, actorName, plugin.crates().prepareNewDraft(crateId, actorName));\n        } catch (Exception error) {\n            return CompletableFuture.failedFuture(error);\n        }\n    }\n\n    public CompletableFuture<Crate> createQuick(UUID actorId, String actorName) {\n        try {\n            requirePrimary();\n            return activate(actorId, actorName, plugin.crates().prepareQuickDraft(actorName));\n        } catch (Exception error) {\n            return CompletableFuture.failedFuture(error);\n        }\n    }\n\n    public CompletableFuture<Crate> cloneDraft(UUID actorId, String actorName, String sourceId, String newId) {\n        try {\n            requirePrimary();\n            return activate(actorId, actorName, plugin.crates().prepareCloneDraft(sourceId, newId, actorName));\n        } catch (Exception error) {\n            return CompletableFuture.failedFuture(error);\n        }\n    }\n\n    private CompletableFuture<Crate> activate(UUID actorId, String actorName,\n                                               CrateRegistry.PreparedDraftActivation candidate) {\n        return plugin.draftSessions().openCrate(actorId, actorName, candidate.crateId(),\n                        plugin.definitionRevision(candidate.crateId()), candidate.payload())\n                .thenCompose(view -> primary(() -> {\n                    DraftSessionService.View current = plugin.draftSessions()\n                            .view(actorId, candidate.crateId()).orElse(view);\n                    if (!current.writable()) {\n                        throw new DraftSessionService.DraftAccessException(\n                                "This draft is currently edited by "\n                                        + (current.ownerName().isBlank() ? "another administrator" : current.ownerName()));\n                    }\n                    byte[] durablePayload = plugin.draftSessions().payload(actorId, candidate.crateId())\n                            .orElseThrow(() -> new IllegalStateException("The durable draft payload is unavailable"));\n                    CrateRegistry.PreparedDraftActivation durable =\n                            plugin.crates().prepareDurableDraft(candidate.crateId(), durablePayload);\n                    Crate installed = plugin.crates().installPreparedDraft(durable);\n                    plugin.crates().queuePreparedDraftMirror(durable);\n                    return installed;\n                }));\n    }\n\n    private <T> CompletableFuture<T> primary(Callable<T> task) {\n        if (Bukkit.isPrimaryThread()) {\n            try {\n                return CompletableFuture.completedFuture(task.call());\n            } catch (Exception error) {\n                return CompletableFuture.failedFuture(error);\n            }\n        }\n        CompletableFuture<T> future = new CompletableFuture<>();\n        Bukkit.getScheduler().runTask(plugin, () -> {\n            try {\n                future.complete(task.call());\n            } catch (Exception error) {\n                future.completeExceptionally(error);\n            }\n        });\n        return future;\n    }\n\n    private static void requirePrimary() {\n        if (!Bukkit.isPrimaryThread()) {\n            throw new IllegalStateException("Crate draft candidate preparation requires the primary thread");\n        }\n    }\n}\n''')

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          source = main.read_text()
          source = source.replace('import com.antondev.crates.service.CrateRegistry;\n',
                                  'import com.antondev.crates.service.CrateRegistry;\nimport com.antondev.crates.service.CrateDraftCreationService;\n', 1)
          source = source.replace('    private DraftSessionService draftSessions;\n',
                                  '    private DraftSessionService draftSessions;\n    private CrateDraftCreationService draftCreation;\n', 1)
          source = source.replace('            draftSessions = new DraftSessionService(database, this::draftStateChanged);\n            definitionPublisher = new DefinitionPublisher',
                                  '            draftSessions = new DraftSessionService(database, this::draftStateChanged);\n            draftCreation = new CrateDraftCreationService(this);\n            definitionPublisher = new DefinitionPublisher', 1)
          source = source.replace('    public DraftSessionService draftSessions() { return draftSessions; }\n',
                                  '    public DraftSessionService draftSessions() { return draftSessions; }\n    public CrateDraftCreationService draftCreation() { return draftCreation; }\n', 1)
          main.write_text(source)

          command = Path('src/main/java/com/antondev/crates/command/CratesAdminCommand.java')
          source = command.read_text()
          old_create = '''    private void create(CommandSender sender, String[] args) throws Exception {\n        if (args.length < 2) { help(sender); return; }\n        Crate created = plugin.crates().createDraft(args[1], sender.getName());\n        registerDraft(sender, created);\n        if (sender instanceof Player player) {\n            plugin.menus().openEditor(player, created);\n        } else sender.sendMessage(Text.parse("<green>Created persistent crate draft</green> <white>" + created.id() + "</white><green>.</green>"));\n    }\n'''
          new_create = '''    private void create(CommandSender sender, String[] args) {\n        if (args.length < 2) { help(sender); return; }\n        plugin.draftCreation().create(actorId(sender), sender.getName(), args[1])\n                .whenComplete((created, error) -> runSync(() -> {\n                    if (error != null) {\n                        plugin.configError(sender, asException(error));\n                    } else if (sender instanceof Player player) {\n                        if (player.isOnline()) plugin.menus().openEditor(player, created);\n                    } else {\n                        sender.sendMessage(Text.parse("<green>Created persistent crate draft</green> <white>"\n                                + created.id() + "</white><green>.</green>"));\n                    }\n                }));\n    }\n'''
          if old_create not in source:
              raise SystemExit('command create anchor not found')
          source = source.replace(old_create, new_create, 1)
          old_clone = '''    private void cloneCrate(CommandSender sender, String[] args) throws Exception {\n        if (args.length < 3) { help(sender); return; }\n        Crate clone = plugin.crates().cloneAsDraft(args[1], args[2], sender.getName());\n        registerDraft(sender, clone);\n        if (sender instanceof Player player) plugin.menus().openEditor(player, clone);\n        else sender.sendMessage(Text.parse("<green>Cloned crate as draft:</green> <white>" + clone.id() + "</white>"));\n    }\n'''
          new_clone = '''    private void cloneCrate(CommandSender sender, String[] args) {\n        if (args.length < 3) { help(sender); return; }\n        plugin.draftCreation().cloneDraft(actorId(sender), sender.getName(), args[1], args[2])\n                .whenComplete((clone, error) -> runSync(() -> {\n                    if (error != null) {\n                        plugin.configError(sender, asException(error));\n                    } else if (sender instanceof Player player) {\n                        if (player.isOnline()) plugin.menus().openEditor(player, clone);\n                    } else {\n                        sender.sendMessage(Text.parse("<green>Cloned crate as draft:</green> <white>"\n                                + clone.id() + "</white>"));\n                    }\n                }));\n    }\n'''
          if old_clone not in source:
              raise SystemExit('command clone anchor not found')
          source = source.replace(old_clone, new_clone, 1)
          command.write_text(source)

          admin = Path('src/main/java/com/antondev/crates/gui/AdminMenuService.java')
          source = admin.read_text()
          old_gui_create = '''        if (kind == MenuHolder.Kind.CRATE_LIST) {\n            try {\n                openCrateEditor(player, plugin.crates().createQuickDraft(player.getName()));\n            } catch (Exception error) {\n                plugin.configError(player, error);\n            }\n        } else if (kind == MenuHolder.Kind.KEY_LIST) {\n'''
          new_gui_create = '''        if (kind == MenuHolder.Kind.CRATE_LIST) {\n            player.closeInventory();\n            plugin.draftCreation().createQuick(player.getUniqueId(), player.getName())\n                    .whenComplete((created, error) -> runFor(player.getUniqueId(), target -> {\n                        if (error != null) plugin.configError(target, asException(error));\n                        else openCrateEditor(target, created);\n                    }));\n        } else if (kind == MenuHolder.Kind.KEY_LIST) {\n'''
          if old_gui_create not in source:
              raise SystemExit('GUI create anchor not found')
          source = source.replace(old_gui_create, new_gui_create, 1)
          old_gui_clone = '''    private void cloneCrate(Player player, String crateId) {\n        plugin.editSessions().request(player, Text.parse("<aqua>Enter the clone's new ID:</aqua>"), (target, value) -> {\n            Crate clone = plugin.crates().cloneAsDraft(crateId, value, target.getName());\n            openCrateEditor(target, clone);\n        });\n    }\n'''
          new_gui_clone = '''    private void cloneCrate(Player player, String crateId) {\n        plugin.editSessions().request(player, Text.parse("<aqua>Enter the clone's new ID:</aqua>"), (target, value) -> {\n            plugin.draftCreation().cloneDraft(target.getUniqueId(), target.getName(), crateId, value)\n                    .whenComplete((clone, error) -> runFor(target.getUniqueId(), current -> {\n                        if (error != null) plugin.configError(current, asException(error));\n                        else openCrateEditor(current, clone);\n                    }));\n        });\n    }\n'''
          if old_gui_clone not in source:
              raise SystemExit('GUI clone anchor not found')
          source = source.replace(old_gui_clone, new_gui_clone, 1)
          admin.write_text(source)
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-durable-draft-creation-patch.yml
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java \
                  src/main/java/com/antondev/crates/service/CrateDraftCreationService.java \
                  src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/command/CratesAdminCommand.java \
                  src/main/java/com/antondev/crates/gui/AdminMenuService.java
          git commit -m 'refactor: make live crate creation durable before activation'
          git push origin HEAD:revamp/5.1.0-full-source-hardening