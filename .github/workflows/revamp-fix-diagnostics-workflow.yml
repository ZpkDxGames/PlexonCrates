name: Fix diagnostics patch guard

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-fix-diagnostics-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Replace indentation-sensitive guard
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/revamp-diagnostics-threading-patch.yml')
          text = path.read_text()
          start = text.index("          old = '''            if (coreBridge != null) {")
          end = text.index("\n          health_start = text.index('    private void updateCoreHealth() {')", start)
          replacement = (
              "          reload_start = text.index('    private boolean applyReload(')\n"
              "          reload_end = text.index('    private static Exception completionException', reload_start)\n"
              "          reload_section = text[reload_start:reload_end]\n"
              "          if 'updateCoreHealth();' not in reload_section:\n"
              "              raise SystemExit('Reload Core health call changed unexpectedly')\n"
              "          reload_section = reload_section.replace('updateCoreHealth();', 'updateCoreHealthAsync();', 1)\n"
              "          text = text[:reload_start] + reload_section + text[reload_end:]\n"
          )
          path.write_text(text[:start] + replacement + text[end:])
      - name: Commit guard fix and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/revamp-fix-diagnostics-workflow.yml
          git add .github/workflows/revamp-diagnostics-threading-patch.yml
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "chore: make diagnostics patch guard structural"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
