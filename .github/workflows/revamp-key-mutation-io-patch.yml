name: Revamp asynchronous key mutation boundary
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-key-mutation-io-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Apply live key mutation IO boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          keys = Path('src/main/java/com/antondev/crates/service/KeyService.java')
          source = keys.read_text()
          mutation_record = '''    public record PreparedMutation(Snapshot snapshot, String mirrorPayload,\n                                   List<DatabaseService.AuditRecord> audits) {\n        public PreparedMutation {\n            snapshot = java.util.Objects.requireNonNull(snapshot, "snapshot");\n            mirrorPayload = java.util.Objects.requireNonNull(mirrorPayload, "mirrorPayload");\n            audits = List.copyOf(audits);\n        }\n    }\n\n'''
          import_record = mutation_record + '''    public record PreparedImport(PreparedMutation mutation, List<String> importedIds) {\n        public PreparedImport {\n            mutation = java.util.Objects.requireNonNull(mutation, "mutation");\n            importedIds = List.copyOf(importedIds);\n        }\n    }\n\n'''
          if mutation_record not in source:
              raise SystemExit('PreparedMutation record anchor not found')
          source = source.replace(mutation_record, import_record, 1)

          definition_anchor = '''    public Optional<KeyDefinition> definition(PreparedMutation prepared, String id) {\n'''
          additions = '''    public PreparedMutation prepareReplaceCaptured(PreparedMutation base, String rawId, Component displayName,\n                                                    ItemStack item, boolean keepPreviousAsLegacy,\n                                                    String editor) throws Exception {\n        java.util.Objects.requireNonNull(base, "base");\n        String id = normalize(rawId);\n        KeyDefinition definition = base.snapshot().definitions().get(id);\n        if (definition == null) throw new IllegalArgumentException("Unknown key ID");\n        if (definition.source() == KeySource.PLEXONKEYS) {\n            throw new IllegalStateException("Live PlexonKeys templates are read-only");\n        }\n        if (item == null || item.getType().isAir()) throw new IllegalArgumentException("A replacement template is required");\n        ItemStack previous = template(base, id)\n                .orElseThrow(() -> new IllegalStateException("The previous exact template is unresolved"));\n        ItemStack replacement = ItemCodec.one(item);\n        var legacy = new ArrayList<>(definition.legacyTemplates());\n        if (keepPreviousAsLegacy && legacy.stream().noneMatch(previous::isSimilar)\n                && !previous.isSimilar(replacement)) legacy.add(previous);\n        Instant now = Instant.now();\n        YamlConfiguration yaml = preparedYaml(base);\n        String path = "keys." + id;\n        yaml.set(path + ".display-name", Text.serialize(displayName));\n        yaml.set(path + ".item", null);\n        yaml.set(path + ".item.base64", ItemCodec.capture(replacement, true));\n        yaml.set(path + ".legacy-templates", legacy.stream().map(value -> ItemCodec.capture(value, true)).toList());\n        yaml.set(path + ".updated-at", now.toString());\n        var audits = new ArrayList<>(base.audits());\n        audits.add(new DatabaseService.AuditRecord(null, editor, "ROTATE", "KEY", id,\n                keepPreviousAsLegacy ? "Replaced exact template and retained the previous template as legacy"\n                        : "Replaced exact template and retired the previous template", now));\n        return prepared(yaml, audits);\n    }\n\n    public PreparedMutation prepareDelete(PreparedMutation base, String rawId, String editor) throws Exception {\n        java.util.Objects.requireNonNull(base, "base");\n        String id = normalize(rawId);\n        if (!base.snapshot().definitions().containsKey(id)) throw new IllegalArgumentException("Unknown key ID");\n        YamlConfiguration yaml = preparedYaml(base);\n        yaml.set("keys." + id, null);\n        var audits = new ArrayList<>(base.audits());\n        audits.add(new DatabaseService.AuditRecord(null, editor, "DELETE", "KEY", id,\n                "Deleted an unused physical key definition after confirmation", Instant.now()));\n        return prepared(yaml, audits);\n    }\n\n    public PreparedImport prepareImport(PreparedMutation base, String sourceYaml, String editor) throws Exception {\n        java.util.Objects.requireNonNull(base, "base");\n        YamlConfiguration importedYaml = new YamlConfiguration();\n        importedYaml.loadFromString(java.util.Objects.requireNonNull(sourceYaml, "sourceYaml"));\n        Snapshot imported = parseSnapshot(importedYaml);\n        List<KeyDefinition> additions = imported.definitions().values().stream()\n                .sorted(Comparator.comparing(KeyDefinition::id)).toList();\n        for (KeyDefinition definition : additions) {\n            if (base.snapshot().definitions().containsKey(definition.id())) {\n                throw new IllegalArgumentException("Key import conflicts with existing ID: " + definition.id());\n            }\n        }\n        Instant now = Instant.now();\n        YamlConfiguration yaml = preparedYaml(base);\n        additions.forEach(definition -> writeDefinition(yaml, definition, now));\n        var audits = new ArrayList<>(base.audits());\n        for (KeyDefinition definition : additions) {\n            audits.add(new DatabaseService.AuditRecord(null, editor, "IMPORT", "KEY", definition.id(),\n                    "Imported a validated physical key definition", now));\n        }\n        PreparedMutation mutation = prepared(yaml, audits);\n        return new PreparedImport(mutation, additions.stream().map(KeyDefinition::id).toList());\n    }\n\n'''
          if definition_anchor not in source:
              raise SystemExit('prepared definition anchor not found')
          source = source.replace(definition_anchor, additions + definition_anchor, 1)

          sync_anchor = '''    public void syncDiscovery() {\n'''
          cache_method = '''    public void clearCachedTemplate(String rawId) {\n        String id = normalize(rawId);\n        var nextCache = new LinkedHashMap<>(lastKnownGood);\n        nextCache.remove(id);\n        lastKnownGood = normalizedCopies(nextCache);\n        database.removeKeyTemplateCache(id);\n    }\n\n'''
          if sync_anchor not in source:
              raise SystemExit('syncDiscovery anchor not found')
          source = source.replace(sync_anchor, cache_method + sync_anchor, 1)
          keys.write_text(source)

          service = Path('src/main/java/com/antondev/crates/service/KeyMutationService.java')
          service.write_text('''package com.antondev.crates.service;\n\nimport com.antondev.crates.PlexonCrates;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.List;\nimport java.util.Objects;\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.CompletableFuture;\nimport java.util.concurrent.atomic.AtomicBoolean;\nimport net.kyori.adventure.text.Component;\nimport org.bukkit.Bukkit;\nimport org.bukkit.inventory.ItemStack;\n\n/** Serial live key-registry mutation boundary. Filesystem durability completes before primary-thread activation. */\npublic final class KeyMutationService {\n    private final PlexonCrates plugin;\n    private final AtomicBoolean busy = new AtomicBoolean();\n\n    public KeyMutationService(PlexonCrates plugin) {\n        this.plugin = Objects.requireNonNull(plugin, "plugin");\n    }\n\n    public boolean busy() { return busy.get(); }\n\n    public CompletableFuture<Void> createCaptured(String id, Component displayName, ItemStack item, String editor) {\n        ItemStack captured = item == null ? null : item.clone();\n        return commit(() -> plugin.keys().prepareCreateCaptured(\n                plugin.keys().beginPreparedMutation(), id, displayName, captured, editor), () -> { });\n    }\n\n    public CompletableFuture<Void> replaceCaptured(String id, Component displayName, ItemStack item,\n                                                   boolean keepPreviousAsLegacy, String editor) {\n        ItemStack captured = item == null ? null : item.clone();\n        return commit(() -> plugin.keys().prepareReplaceCaptured(\n                plugin.keys().beginPreparedMutation(), id, displayName, captured, keepPreviousAsLegacy, editor), () -> { });\n    }\n\n    public CompletableFuture<Void> bindExternal(String id, String editor) {\n        if (plugin.keys().definition(id).isPresent()) return CompletableFuture.completedFuture(null);\n        return commit(() -> plugin.keys().prepareBindExternal(\n                plugin.keys().beginPreparedMutation(), id, editor), () -> { });\n    }\n\n    public CompletableFuture<Void> delete(String id, String editor) {\n        return commit(() -> plugin.keys().prepareDelete(\n                plugin.keys().beginPreparedMutation(), id, editor), () -> plugin.keys().clearCachedTemplate(id));\n    }\n\n    public CompletableFuture<List<String>> importDefinitions(Path sourceFile, String editor) {\n        if (!Bukkit.isPrimaryThread()) {\n            return CompletableFuture.failedFuture(new IllegalStateException("Key import must be requested on the primary thread"));\n        }\n        if (!busy.compareAndSet(false, true)) return busyFailure();\n        Path source = sourceFile.toAbsolutePath().normalize();\n        CompletableFuture<List<String>> future = plugin.io().submit(() -> {\n            if (!Files.isRegularFile(source) || !source.getFileName().toString().endsWith(".yml")) {\n                throw new IllegalArgumentException("Key import source must be an existing .yml file");\n            }\n            return Files.readString(source, StandardCharsets.UTF_8);\n        }).thenCompose(payload -> primary(() -> plugin.keys().prepareImport(\n                plugin.keys().beginPreparedMutation(), payload, editor)))\n                .thenCompose(prepared -> plugin.io().run(() -> plugin.keys().writePreparedMutation(prepared.mutation()))\n                        .thenCompose(ignored -> primary(() -> {\n                            plugin.keys().installPreparedMutation(prepared.mutation());\n                            return prepared.importedIds();\n                        })));\n        return future.whenComplete((ignored, error) -> busy.set(false));\n    }\n\n    private CompletableFuture<Void> commit(CheckedPreparation preparation, Runnable afterInstall) {\n        if (!Bukkit.isPrimaryThread()) {\n            return CompletableFuture.failedFuture(new IllegalStateException("Key mutation must be requested on the primary thread"));\n        }\n        if (!busy.compareAndSet(false, true)) return busyFailure();\n        KeyService.PreparedMutation prepared;\n        try {\n            prepared = preparation.prepare();\n        } catch (Exception error) {\n            busy.set(false);\n            return CompletableFuture.failedFuture(error);\n        }\n        CompletableFuture<Void> future = plugin.io().run(() -> plugin.keys().writePreparedMutation(prepared))\n                .thenCompose(ignored -> primary(() -> {\n                    plugin.keys().installPreparedMutation(prepared);\n                    afterInstall.run();\n                    return null;\n                }));\n        return future.whenComplete((ignored, error) -> busy.set(false));\n    }\n\n    private <T> CompletableFuture<T> primary(Callable<T> task) {\n        if (Bukkit.isPrimaryThread()) {\n            try {\n                return CompletableFuture.completedFuture(task.call());\n            } catch (Exception error) {\n                return CompletableFuture.failedFuture(error);\n            }\n        }\n        CompletableFuture<T> future = new CompletableFuture<>();\n        try {\n            Bukkit.getScheduler().runTask(plugin, () -> {\n                try {\n                    future.complete(task.call());\n                } catch (Exception error) {\n                    future.completeExceptionally(error);\n                }\n            });\n        } catch (RuntimeException error) {\n            future.completeExceptionally(error);\n        }\n        return future;\n    }\n\n    private static <T> CompletableFuture<T> busyFailure() {\n        return CompletableFuture.failedFuture(\n                new IllegalStateException("Another key-registry mutation is already in progress"));\n    }\n\n    @FunctionalInterface\n    private interface CheckedPreparation {\n        KeyService.PreparedMutation prepare() throws Exception;\n    }\n}\n''')

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          source = main.read_text()
          source = source.replace('import com.antondev.crates.service.KeyService;\n',
                                  'import com.antondev.crates.service.KeyService;\nimport com.antondev.crates.service.KeyMutationService;\n', 1)
          source = source.replace('    private KeyService keys;\n',
                                  '    private KeyService keys;\n    private KeyMutationService keyMutations;\n', 1)
          source = source.replace('            crateTransfers = new CrateTransferService(this);\n            definitionPublisher =',
                                  '            crateTransfers = new CrateTransferService(this);\n            keyMutations = new KeyMutationService(this);\n            definitionPublisher =', 1)
          source = source.replace('    public KeyService keys() { return keys; }\n',
                                  '    public KeyService keys() { return keys; }\n    public KeyMutationService keyMutations() { return keyMutations; }\n', 1)
          main.write_text(source)

          admin = Path('src/main/java/com/antondev/crates/gui/AdminMenuService.java')
          source = admin.read_text()

          old_import = '''    private void importKeys(Player player) {\n        plugin.editSessions().request(player, Text.parse("<aqua>Enter a version 2 key-registry filename from the <white>imports</white> folder:</aqua>"), (target, value) -> {\n            String fileName = value.trim();\n            if (!fileName.matches("[A-Za-z0-9][A-Za-z0-9._-]{0,127}\\\\.yml")) {\n                throw new IllegalArgumentException("Use a simple .yml filename without folders");\n            }\n            Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n            Path source = root.resolve(fileName).normalize();\n            if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports folder");\n            List<String> imported = plugin.keys().importDefinitions(source, target.getName());\n            target.sendMessage(Text.parse("<green>Imported exact key definitions:</green> <white>"\n                    + String.join(", ", imported) + "</white>"));\n            openKeys(target, 0);\n        });\n    }\n'''
          new_import = '''    private void importKeys(Player player) {\n        plugin.editSessions().request(player, Text.parse("<aqua>Enter a version 2 key-registry filename from the <white>imports</white> folder:</aqua>"), (target, value) -> {\n            String fileName = value.trim();\n            if (!fileName.matches("[A-Za-z0-9][A-Za-z0-9._-]{0,127}\\\\.yml")) {\n                throw new IllegalArgumentException("Use a simple .yml filename without folders");\n            }\n            Path root = plugin.getDataFolder().toPath().resolve("imports").toAbsolutePath().normalize();\n            Path source = root.resolve(fileName).normalize();\n            if (!source.getParent().equals(root)) throw new IllegalArgumentException("Import path leaves the imports folder");\n            plugin.keyMutations().importDefinitions(source, target.getName())\n                    .whenComplete((imported, error) -> runFor(target.getUniqueId(), current -> {\n                        if (error != null) plugin.configError(current, asException(error));\n                        else current.sendMessage(Text.parse("<green>Imported exact key definitions:</green> <white>"\n                                + String.join(", ", imported) + "</white>"));\n                        openKeys(current, 0);\n                    }));\n        });\n    }\n'''
          if old_import not in source:
              raise SystemExit('importKeys anchor not found')
          source = source.replace(old_import, new_import, 1)

          start = source.index('    private void keyEntry(Player player, String keyId, InventoryClickEvent event) throws Exception {')
          end = source.index('    private void replaceKeyReferences(', start)
          old_key_entry = source[start:end]
          new_key_entry = '''    private void keyEntry(Player player, String keyId, InventoryClickEvent event) throws Exception {\n        boolean shift = event.isShiftClick();\n        boolean left = event.isLeftClick();\n        boolean right = event.isRightClick();\n        boolean bound = plugin.keys().definition(keyId).isPresent();\n        if (!bound && shift && right) {\n            player.sendMessage(Text.parse("<gray>That live category is not bound, so there is no PlexonCrates key definition to delete.</gray>"));\n            return;\n        }\n        if (!bound) {\n            plugin.keyMutations().bindExternal(keyId, player.getName())\n                    .whenComplete((ignored, error) -> runFor(player.getUniqueId(), target -> {\n                        if (error != null) { plugin.configError(target, asException(error)); return; }\n                        try { keyEntryBound(target, keyId, shift, left, right); }\n                        catch (Exception actionError) { plugin.configError(target, actionError); }\n                    }));\n            return;\n        }\n        keyEntryBound(player, keyId, shift, left, right);\n    }\n\n    private void keyEntryBound(Player player, String keyId, boolean shift, boolean left, boolean right) throws Exception {\n        KeyDefinition definition = plugin.keys().definition(keyId).orElseThrow();\n        if (shift && left) {\n            if (definition.source() == com.antondev.crates.domain.key.KeySource.PLEXONKEYS) {\n                throw new IllegalStateException("Live PlexonKeys templates are read-only in PlexonCrates");\n            }\n            ItemStack current = plugin.keys().template(keyId).orElseThrow(() -> new IllegalStateException("This key is unresolved"));\n            plugin.editSessions().beginKeyRotation(player, definition, current);\n            openKeyTemplate(player);\n        } else if (shift && right) {\n            long references = plugin.crates().referencesToKey(keyId);\n            if (references > 0) {\n                plugin.editSessions().request(player, Text.parse("<yellow>This key is used by " + references\n                        + " crate(s). Enter a replacement key ID, or /cancel:</yellow>"), (target, value) -> {\n                    if (plugin.keys().definition(value).isEmpty() || plugin.keys().resolve(value).isEmpty()) {\n                        throw new IllegalArgumentException("The replacement key must exist and resolve exactly");\n                    }\n                    replaceKeyReferences(target, keyId, value);\n                });\n            } else if (publishedKeyReferences(keyId) > 0) {\n                plugin.messages().send(player, "key-replacement-awaiting-publish");\n            } else openKeyDeleteConfirmation(player, keyId);\n        } else if (right) {\n            plugin.keys().give(player, keyId, 1);\n            plugin.messages().send(player, "key-given", Text.value("amount", 1),\n                    Text.component("key", plugin.keys().definition(keyId).orElseThrow().displayName()), Text.value("player", player.getName()));\n        } else {\n            player.sendMessage(Text.parse("<aqua>" + keyId + "</aqua> <dark_gray>•</dark_gray> <gray>" + definition.source()\n                    + " • " + (plugin.keys().resolve(keyId).isPresent() ? "resolved" : "unresolved") + "</gray>"));\n        }\n    }\n\n'''
          source = source[:start] + new_key_entry + source[end:]

          old_delete = '''    private void confirmKeyDelete(Player player, String keyId) throws Exception {\n        if (plugin.crates().referencesToKey(keyId) > 0) {\n            throw new IllegalStateException("Replace every crate reference before deleting this key");\n        }\n        if (publishedKeyReferences(keyId) > 0) {\n            throw new IllegalStateException("Publish every pending key-reference change before deleting this active key");\n        }\n        plugin.keys().delete(keyId, player.getName());\n        openKeys(player, 0);\n    }\n'''
          new_delete = '''    private void confirmKeyDelete(Player player, String keyId) throws Exception {\n        if (plugin.crates().referencesToKey(keyId) > 0) {\n            throw new IllegalStateException("Replace every crate reference before deleting this key");\n        }\n        if (publishedKeyReferences(keyId) > 0) {\n            throw new IllegalStateException("Publish every pending key-reference change before deleting this active key");\n        }\n        plugin.keyMutations().delete(keyId, player.getName())\n                .whenComplete((ignored, error) -> runFor(player.getUniqueId(), target -> {\n                    if (error != null) plugin.configError(target, asException(error));\n                    openKeys(target, 0);\n                }));\n    }\n'''
          if old_delete not in source:
              raise SystemExit('confirmKeyDelete anchor not found')
          source = source.replace(old_delete, new_delete, 1)

          old_select = '''    private void selectKey(Player player, String crateId, String keyId) throws Exception {\n        if (!requireWritableDraft(player, crateId)) return;\n        if (plugin.keys().definition(keyId).isEmpty()) plugin.keys().bindExternal(keyId, player.getName());\n        Crate crate = plugin.crates().find(crateId).orElseThrow();\n        plugin.crates().setAcceptedKeys(crate.id(), List.of(keyId), Math.max(1, crate.keyCost()), player.getName());\n        saveDraftRevision(player, crateId, "KEY", "Replaced accepted physical key");\n        refreshCrate(player, crateId);\n    }\n'''
          new_select = '''    private void selectKey(Player player, String crateId, String keyId) throws Exception {\n        if (!requireWritableDraft(player, crateId)) return;\n        if (plugin.keys().definition(keyId).isEmpty()) {\n            plugin.keyMutations().bindExternal(keyId, player.getName())\n                    .whenComplete((ignored, error) -> runFor(player.getUniqueId(), target -> {\n                        if (error != null) { plugin.configError(target, asException(error)); return; }\n                        try { selectBoundKey(target, crateId, keyId); }\n                        catch (Exception actionError) { plugin.configError(target, actionError); }\n                    }));\n            return;\n        }\n        selectBoundKey(player, crateId, keyId);\n    }\n\n    private void selectBoundKey(Player player, String crateId, String keyId) throws Exception {\n        if (!requireWritableDraft(player, crateId)) return;\n        Crate crate = plugin.crates().find(crateId).orElseThrow();\n        plugin.crates().setAcceptedKeys(crate.id(), List.of(keyId), Math.max(1, crate.keyCost()), player.getName());\n        saveDraftRevision(player, crateId, "KEY", "Replaced accepted physical key");\n        refreshCrate(player, crateId);\n    }\n'''
          if old_select not in source:
              raise SystemExit('selectKey anchor not found')
          source = source.replace(old_select, new_select, 1)

          old_confirm = '''        if (kind == MenuHolder.Kind.KEY_TEMPLATE) {\n            EditSessionService.KeyDraft draft = plugin.editSessions().key(player);\n            if (draft == null || draft.template() == null) throw new IllegalArgumentException("Capture an exact key item first");\n            if (draft.rotation()) {\n                plugin.keys().replaceCaptured(draft.id(), draft.displayName(), draft.template(),\n                        draft.keepPreviousAsLegacy(), player.getName());\n            } else plugin.keys().createCaptured(draft.id(), draft.displayName(), draft.template(), player.getName());\n            plugin.editSessions().clearKey(player);\n            openKeys(player, 0);\n        } else if (kind == MenuHolder.Kind.REWARD_BUILDER) {\n'''
          new_confirm = '''        if (kind == MenuHolder.Kind.KEY_TEMPLATE) {\n            EditSessionService.KeyDraft draft = plugin.editSessions().key(player);\n            if (draft == null || draft.template() == null) throw new IllegalArgumentException("Capture an exact key item first");\n            java.util.concurrent.CompletableFuture<Void> mutation = draft.rotation()\n                    ? plugin.keyMutations().replaceCaptured(draft.id(), draft.displayName(), draft.template(),\n                            draft.keepPreviousAsLegacy(), player.getName())\n                    : plugin.keyMutations().createCaptured(draft.id(), draft.displayName(), draft.template(), player.getName());\n            mutation.whenComplete((ignored, error) -> runFor(player.getUniqueId(), target -> {\n                if (error != null) { plugin.configError(target, asException(error)); return; }\n                plugin.editSessions().clearKey(target);\n                openKeys(target, 0);\n            }));\n        } else if (kind == MenuHolder.Kind.REWARD_BUILDER) {\n'''
          if old_confirm not in source:
              raise SystemExit('confirmDraft key anchor not found')
          source = source.replace(old_confirm, new_confirm, 1)
          admin.write_text(source)
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-key-mutation-io-patch.yml
          git add src/main/java/com/antondev/crates/service/KeyService.java \
                  src/main/java/com/antondev/crates/service/KeyMutationService.java \
                  src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/gui/AdminMenuService.java
          git commit -m 'perf: move live key mutation IO off the server thread'
          git push origin HEAD:revamp/5.1.0-full-source-hardening
