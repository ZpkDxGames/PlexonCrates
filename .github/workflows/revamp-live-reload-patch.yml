name: Revamp live reload patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-live-reload-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Route live reload callers and update contract
        shell: python
        run: |
          from pathlib import Path

          command = Path('src/main/java/com/antondev/crates/command/CratesAdminCommand.java')
          text = command.read_text()
          old = 'case "reload" -> plugin.reloadFor(sender);'
          new = 'case "reload" -> plugin.requestReload(sender);'
          if old not in text:
              raise SystemExit('CratesAdminCommand live reload call changed unexpectedly')
          command.write_text(text.replace(old, new, 1))

          test = Path('src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java')
          text = test.read_text()
          old = 'assertTrue(main.contains("registerEvents(new CrateMenuEventRouter(menus, playerRouter), this)"));'
          new = 'assertTrue(main.contains("registerEvents(new CrateMenuEventRouter(this, menus, playerRouter), this)"));'
          if old not in text:
              raise SystemExit('Event-router constructor assertion changed unexpectedly')
          text = text.replace(old, new, 1)
          marker = 'assertTrue(router.contains("playerDrag(InventoryDragEvent event)"));'
          replacement = marker + '\n        assertTrue(router.contains("plugin.requestReload(player)"));\n        assertTrue(main.contains("public void requestReload(CommandSender sender)"));'
          if marker not in text:
              raise SystemExit('Inventory routing assertion marker changed unexpectedly')
          test.write_text(text.replace(marker, replacement, 1))
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/revamp-live-reload-patch.yml
          git add src/main/java/com/antondev/crates/command/CratesAdminCommand.java \
                  src/test/java/com/antondev/crates/gui/player/Phase3PlayerCrateUxArchitectureTest.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "perf: route admin reload through async preload path"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
