name: Revamp Phoenix marker literal fix

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-phoenix-marker-literal-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Fix Phoenix marker literal
        run: python tools/revamp_fix_phoenix_marker_literal.py
      - name: Commit fix and remove temporary helpers
        run: |
          git rm .github/workflows/revamp-phoenix-marker-literal-fix.yml tools/revamp_fix_phoenix_marker_literal.py
          git add src/main/java/com/antondev/crates/migration/phoenix/PhoenixMigrationService.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "fix: escape Phoenix migration marker lines"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
