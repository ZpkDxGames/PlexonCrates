name: Revamp publication IO patch

on:
  push:
    branches:
      - revamp/5.1.0-full-source-hardening
    paths:
      - .github/workflows/revamp-publication-io-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Split authoritative activation from optional YAML IO
        shell: python
        run: |
          from pathlib import Path

          registry = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          text = registry.read_text()
          old = '''    public void installPublished(PreparedPublication publication) throws IOException {
              AtomicFiles.write(publication.file(), new String(publication.payload(), StandardCharsets.UTF_8));
              Crate previous = crates.get(publication.crateId());
              install(publication.crateId(), publication.file(), publication.crate());
              payloads.put(publication.crateId(), publication.payload());
              fireChange(publication.crate(), changeType(previous, publication.crate()));
          }
          '''.replace('          ', '')
          new = '''    public void installPublishedInMemory(PreparedPublication publication) {
              Crate previous = crates.get(publication.crateId());
              install(publication.crateId(), publication.file(), publication.crate());
              payloads.put(publication.crateId(), publication.payload());
              fireChange(publication.crate(), changeType(previous, publication.crate()));
          }

          public void writePublishedMirror(PreparedPublication publication) throws IOException {
              AtomicFiles.write(publication.file(), new String(publication.payload(), StandardCharsets.UTF_8));
          }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('CrateRegistry publication install block changed unexpectedly')
          registry.write_text(text.replace(old, new, 1))

          publisher = Path('src/main/java/com/antondev/crates/service/DefinitionPublisher.java')
          text = publisher.read_text()
          old = '''        CompletableFuture<Publication> result = drafts.freezeCrate(actor, crateId)
                  .thenCompose(frozen -> primary(() -> prepare(frozen, name)))
                  .thenCompose(prepared -> repository.publish(request(prepared))
                          .thenCompose(saved -> primary(() -> activate(prepared, saved))));
          '''.replace('          ', '')
          new = '''        CompletableFuture<Publication> result = drafts.freezeCrate(actor, crateId)
                  .thenCompose(frozen -> primary(() -> prepare(frozen, name)))
                  .thenCompose(prepared -> repository.publish(request(prepared))
                          .thenCompose(saved -> primary(() -> activate(prepared, saved))
                                  .thenCompose(publication -> mirror(prepared.publication(), publication))));
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('DefinitionPublisher publish chain changed unexpectedly')
          text = text.replace(old, new, 1)

          start = text.index('    private Publication activate(Prepared prepared, DatabaseService.PublishResult saved) {')
          end = text.index('    private static DatabaseService.DefinitionBundle bundle(', start)
          replacement = '''    private Publication activate(Prepared prepared, DatabaseService.PublishResult saved) {
              requirePrimaryThread();
              Crate published = prepared.publication().crate();
              if (published.state() == CrateState.PUBLISHED) {
                  runtime.install(saved.runtimeRevision(), saved.definition().publishedRevision(), published,
                          prepared.publication().payload());
              } else {
                  runtime.remove(saved.runtimeRevision(), saved.definition().publishedRevision(), published.id());
              }
              plugin.recordDefinitionRevision(published.id(), saved.definition().publishedRevision());
              drafts.published(published.id());
              crates.installPublishedInMemory(prepared.publication());
              try {
                  plugin.displays().refresh();
              } catch (RuntimeException error) {
                  plugin.getLogger().log(Level.WARNING, "Published " + published.id()
                          + ", but display reconciliation needs attention", error);
              }
              return new Publication(published, saved.definition().publishedRevision(), saved.runtimeRevision(), false);
          }

          private CompletableFuture<Publication> mirror(
                  CrateRegistry.PreparedPublication prepared, Publication publication) {
              return plugin.io().submit(() -> {
                  boolean updated = true;
                  try {
                      crates.writePublishedMirror(prepared);
                  } catch (Exception error) {
                      updated = false;
                      plugin.getLogger().log(Level.WARNING, "Published " + publication.crate().id()
                              + " from SQLite, but its optional YAML mirror could not be updated", error);
                  }
                  return new Publication(publication.crate(), publication.crateRevision(),
                          publication.runtimeRevision(), updated);
              }).exceptionally(error -> {
                  plugin.getLogger().log(Level.WARNING, "Published " + publication.crate().id()
                          + " from SQLite, but its optional YAML mirror task could not be scheduled", error);
                  return new Publication(publication.crate(), publication.crateRevision(),
                          publication.runtimeRevision(), false);
              });
          }

          '''
          text = text[:start] + replacement + text[end:]
          publisher.write_text(text)

          main = Path('src/main/java/com/antondev/crates/PlexonCrates.java')
          text = main.read_text()
          old = 'import com.antondev.crates.service.CrateRegistry;\n'
          new = old + 'import com.antondev.crates.service.AsyncIoService;\n'
          if old not in text or 'import com.antondev.crates.service.AsyncIoService;' in text:
              raise SystemExit('PlexonCrates AsyncIoService import marker changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '    private CrateRegistry crates;\n'
          new = old + '    private AsyncIoService io;\n'
          if old not in text:
              raise SystemExit('PlexonCrates service field marker changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '            database = new DatabaseService(getLogger(), safeDataPath(databaseFile), maximumQueuedWrites);\n'
          new = old + '            io = new AsyncIoService();\n'
          if old not in text:
              raise SystemExit('PlexonCrates database composition marker changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '        if (openingLog != null) openingLog.close();\n        if (database != null) database.close();\n'
          new = '        if (openingLog != null) openingLog.close();\n        if (io != null) io.close();\n        if (database != null) database.close();\n'
          if old not in text:
              raise SystemExit('PlexonCrates shutdown marker changed unexpectedly')
          text = text.replace(old, new, 1)

          old = '    public CrateRegistry crates() { return crates; }\n'
          new = old + '    public AsyncIoService io() { return io; }\n'
          if old not in text:
              raise SystemExit('PlexonCrates getter marker changed unexpectedly')
          text = text.replace(old, new, 1)
          main.write_text(text)
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/revamp-publication-io-patch.yml
          git add src/main/java/com/antondev/crates/PlexonCrates.java \
                  src/main/java/com/antondev/crates/service/CrateRegistry.java \
                  src/main/java/com/antondev/crates/service/DefinitionPublisher.java
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git commit -m "perf: move optional publication mirror IO off main thread"
          git push origin HEAD:revamp/5.1.0-full-source-hardening
