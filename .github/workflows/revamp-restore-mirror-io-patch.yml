name: Revamp restored draft mirror IO
on:
  push:
    branches: [revamp/5.1.0-full-source-hardening]
    paths: ['.github/workflows/revamp-restore-mirror-io-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/5.1.0-full-source-hardening
          fetch-depth: 0
      - name: Move restored draft mirror write to ordered IO queue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/antondev/crates/service/CrateRegistry.java')
          source = path.read_text()
          old = '''        String serialized = yaml.saveToString();\n        AtomicFiles.write(file, serialized);\n        install(id, file, restored);\n        payloads.put(id, serialized.getBytes(StandardCharsets.UTF_8));\n        fireChange(restored, changeType(previous, restored));\n        return restored;\n'''
          new = '''        String serialized = yaml.saveToString();\n        persistEditableMirror(file, serialized);\n        install(id, file, restored);\n        payloads.put(id, serialized.getBytes(StandardCharsets.UTF_8));\n        fireChange(restored, changeType(previous, restored));\n        return restored;\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one restore mirror block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit source patch and remove temporary helper
        run: |
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git rm .github/workflows/revamp-restore-mirror-io-patch.yml
          git add src/main/java/com/antondev/crates/service/CrateRegistry.java
          git commit -m 'perf: queue restored draft mirror writes off the server thread'
          git push origin HEAD:revamp/5.1.0-full-source-hardening