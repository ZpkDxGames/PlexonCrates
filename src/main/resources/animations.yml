# PlexonCrates 6.0 opening-animation profiles.
# Presentation only: profiles never select rewards, consume payment, update pity,
# alter limits, grant items, or write opening statistics.
config-version: 1

# Migration-safe default. Existing crates retain their accepted 5.x animation
# (INSTANT/ROULETTE/REVEAL/SUMMARY) until an administrator deliberately chooses
# a named global profile or per-crate override.
global-profile: legacy

profiles:
  default:
    style: ROULETTE
    stages:
      start-ticks: 4
      charge-ticks: 6
      selection-ticks: 40
      reveal-ticks: 10
      celebration-ticks: 10
      finish-ticks: 4
    particle: END_ROD
    sound: BLOCK_NOTE_BLOCK_PLING
    sound-volume: 1.0
    sound-pitch: 1.0
    particle-budget-per-tick: 96
    receiver-range: 48.0
    summary-on-finish: false

  quick-reveal:
    style: CHARGE_REVEAL
    stages:
      start-ticks: 4
      charge-ticks: 30
      selection-ticks: 0
      reveal-ticks: 12
      celebration-ticks: 12
      finish-ticks: 4
    particle: END_ROD
    sound: BLOCK_NOTE_BLOCK_PLING
    sound-volume: 1.0
    sound-pitch: 1.0
    particle-budget-per-tick: 96
    receiver-range: 48.0
    summary-on-finish: false

# Per-crate assignments are optional. A crate absent here inherits global-profile.
# The reserved value "legacy" may also be used explicitly to keep one crate on
# its existing crate.animation presentation while another global profile is active.
crate-profiles: {}
