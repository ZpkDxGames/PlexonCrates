# PlexonCrates 6.0.0 | Created by Tonim (ZpkDxGames)
# Paper 26.2 / Java 25. All text uses MiniMessage, never legacy & colors.
config-version: 3

database:
  # Mutable links, statistics, limits, pity, history, journals, drafts, and audit data.
  file: data/plexoncrates.db
  maximum-queued-writes: 4096
  shutdown-timeout-seconds: 8

settings:
  enabled: true
  # [] allows every world. Exclusions always take priority.
  worlds: [Survival_World, Survival_World_nether, Survival_World_the_end]
  excluded-worlds: []
  # Reward items that do not fit are safely dropped at the player's feet.
  drop-overflow-items: true
  # Maximum number of keys consumed by one sneak-right-click or command.
  maximum-bulk-open: 64
  # Save dirty statistics on a lightweight interval and again on shutdown.
  statistics-save-seconds: 300

# Every module ships in this JAR. These switches hide gameplay controls while
# preserving configured definitions and durable player state.
features:
  milestones: true
  rerolls: true
  mass-opening: true
  claim-inbox: true
  virtual-key-wallet: false
  selective-opening: true
  alternative-rewards: true
  portable-crates: true

plexonkeys:
  enabled: true
  plugin-name: PlexonKeys
  # LIVE_FIRST reads PlexonKeys' current CONFIG or CAPTURED templates directly.
  # If PlexonKeys is absent or unavailable, keys.yml is used automatically.
  mode: LIVE_FIRST
  fallback-file: keys.yml

interaction:
  # Offhand keys are ignored by default to prevent surprising consumption.
  consume-offhand-keys: false
  left-click-preview: true
  right-click-open: true
  sneak-right-click-bulk: true
  cancel-vanilla-block-use: true
  maximum-target-distance: 8

opening:
  animation-enabled: true
  default-animation: ROULETTE
  # Optional exact overflow policy: REJECT, DROP, CLAIM, or CLAIM_ALL. If omitted,
  # settings.drop-overflow-items keeps the 2.0-compatible DROP/REJECT behavior.
  # overflow: CLAIM
  bulk-summary-threshold: 5
  # MANUAL_REVIEW never blindly reruns command rewards after a crash.
  recovery-policy: MANUAL_REVIEW
  animation-duration-ticks: 54
  animation-period-ticks: 2
  opening-sound: minecraft:block.note_block.hat
  finish-sound: minecraft:entity.player.levelup
  sound-volume: 0.8
  sound-pitch: 1.1

holograms:
  enabled: true
  vertical-offset: 1.65
  view-range: 32.0
  line-width: 240
  shadowed: true
  see-through: false

particles:
  enabled: true
  type: END_ROD
  # NONE, SPARKLE, RING, DOUBLE_RING, ORBIT, HELIX, PULSE, RISING, AURA
  style: AURA
  interval-ticks: 4
  # Number emitted at each generated point. Geometry points are bounded separately.
  count: 1
  points: 12
  radius: 0.65
  height: 1.25
  rotation-speed: 0.22
  vertical-speed: 0.08
  # Legacy spread values remain accepted for compatible configuration surfaces.
  horizontal-spread: 0.0
  vertical-spread: 0.0
  view-range: 32.0

# Cosmetic work is intentionally bounded. Exceeding these limits staggers/defer
# presentation only; crate outcomes, key consumption, and reward delivery are unaffected.
performance:
  particles:
    max-locations-per-tick: 64
    max-particles-per-tick: 1000
    max-per-crate-per-tick: 80
    max-per-viewer-per-tick: 200
    stagger: true

editing:
  input-timeout-seconds: 60
  session-timeout-minutes: 30

locations:
  # [] inherits settings.worlds. Unsafe or temporary block types are rejected.
  allowed-worlds: []
  denied-materials:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - WATER
  - LAVA
  - FIRE
  - SOUL_FIRE
  - NETHER_PORTAL
  - END_PORTAL
  - END_GATEWAY

integrations:
  placeholderapi: true
  vault: true

logging:
  console: true
  file: true
  date-format: dd/MM/yyyy HH:mm:ss
