# PlexonCrates 4.0
# Global engine configuration. Crates, rewards, key items and locations live in crates.yml.

plugin:
  # Prefix used by command and system messages. '&' color codes are supported.
  prefix: "&8[&6PlexonCrates&8] &r"
  locale: "en_US"
  debug: false

database:
  # SQLite is intentionally local and self-contained.
  file: "data/plexoncrates.db"
  # Number of background workers used for database reads/writes.
  pool-size: 2
  # SQLite busy timeout in milliseconds.
  busy-timeout-ms: 5000

opening:
  # Prevents a player from starting a second opening while an animation is active.
  one-at-a-time: true
  # Opening animation duration. Individual animation implementations may use this as a target.
  duration-ticks: 100
  # If true, a player closing an opening inventory has it reopened until the animation completes.
  lock-inventory-during-animation: true

keys:
  # Virtual keys are stored in SQLite and shown in /crates.
  virtual-enabled: true
  # Physical keys are exact ItemStack matches against each crate key definition.
  physical-enabled: true
  # If true, right-clicking a physical crate while holding its exact key opens it.
  physical-open-requires-held-key: true

claims:
  # Item rewards that do not fit in the inventory are stored as durable claims.
  enabled: true
  # Maximum claims shown per GUI page.
  page-size: 45

effects:
  enabled: true
  # Tick interval for ambient effects. 4-10 is recommended.
  idle-interval-ticks: 5
  # Maximum linked crate blocks rendered per idle pass.
  max-blocks-per-pass: 64
  sounds-enabled: true
  particles-enabled: true

messages:
  no-permission: "&cYou do not have permission to do that."
  player-only: "&cThis action can only be used by a player."
  crate-not-found: "&cUnknown crate: &f%crate%"
  already-opening: "&eYou already have a crate opening in progress."
  no-key: "&cYou do not have a matching key for &f%crate%&c."
  linked: "&aLinked this block to crate &f%crate%&a."
  unlinked: "&aRemoved the crate link from this block."
  tile-required: "&cPhysical crate blocks must support persistent block data (chest, barrel, shulker, etc.)."
  reload-complete: "&aPlexonCrates configuration reloaded."
  reward-added: "&aCaptured &f%item% &aas a reward for &f%crate%&a."
  key-granted: "&aGranted &f%amount%x %crate% &avirtual key(s) to &f%player%&a."
  claim-delivered: "&aClaim delivered."
  claim-blocked: "&eFree some inventory space before claiming this reward."
