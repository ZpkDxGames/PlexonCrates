config-version: 3
id: legendary
state: PUBLISHED
display-order: 40
display-name: <gradient:#FFB347:#FFE59A><bold>Legendary Crate</bold></gradient>
description:
- <gray>The rarest treasures in the Plexon vault.</gray>
access:
