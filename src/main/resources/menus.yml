# Fixed slot layouts; every label and lore line supports MiniMessage placeholders.
filler:
  material: BLACK_STAINED_GLASS_PANE
  name: ' '
  lore: []

browser:
  title: <gradient:#DDE5F0:#A3BEDF><bold>PLEXON CRATES</bold></gradient>
  size: 27
  crate-slots: [10, 12, 14, 16]
  info:
    slot: 4
    material: NETHER_STAR
    name: <white><bold>Crate Hall</bold></white>
    lore:
    - ''
    - <gray>Preview every prize before spending a key.</gray>
    - <gray>Your physical keys come directly from PlexonKeys.</gray>
    - ''
    - <dark_gray>Left-click preview • Right-click open</dark_gray>
  close:
    slot: 22
    material: BARRIER
    name: <red>Close</red>
    lore: []

preview:
  title: <crate> <dark_gray>•</dark_gray> <gray>Rewards</gray>
  size: 54
  reward-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  reward-lore:
  - ''
  - <gray>Chance</gray> <dark_gray>»</dark_gray> <yellow><chance>%</yellow>
  - <gray>Weight</gray> <dark_gray>»</dark_gray> <white><weight></white>
  open:
    slot: 49
    material: TRIPWIRE_HOOK
    name: <green><bold>Open <crate></bold></green>
    lore:
    - ''
    - <gray>Keys available</gray> <dark_gray>»</dark_gray> <white><keys></white>
    - <gray>Required key</gray> <dark_gray>»</dark_gray> <key>
    - ''
    - <green>Click to open one.</green>
  previous:
    slot: 45
    material: ARROW
    name: <gray>Previous page</gray>
    lore: []
  back:
    slot: 48
    material: OAK_DOOR
    name: <gray>Back</gray>
    lore: []
  next:
    slot: 53
    material: ARROW
    name: <gray>Next page</gray>
    lore: []

opening:
  title: <crate> <dark_gray>•</dark_gray> <gray>Opening…</gray>
  size: 27
  rail-slots: [10, 11, 12, 13, 14, 15, 16]
  center-slot: 13
  marker:
    material: LIME_STAINED_GLASS_PANE
    name: <green>▼ Your reward ▼</green>
    lore: []
  marker-top-slot: 4
  marker-bottom-slot: 22

admin:
  title: <gold><bold>PLEXONCRATES</bold></gold> <dark_gray>•</dark_gray> <gray>Admin</gray>
  size: 27
  crate-slots: [10, 12, 14, 16]
  status:
    slot: 4
    material: MAP
    name: <white><bold>System status</bold></white>
    lore:
    - ''
    - <gray>Crates</gray> <dark_gray>»</dark_gray> <white><crates></white>
    - <gray>Rewards</gray> <dark_gray>»</dark_gray> <white><rewards></white>
    - <gray>Locations</gray> <dark_gray>»</dark_gray> <white><locations></white>
    - <gray>Key source</gray> <dark_gray>»</dark_gray> <white><key_source></white>
  reload:
    slot: 22
    material: CLOCK
    name: <aqua>Reload everything</aqua>
    lore:
    - <gray>Validates files before replacing live settings.</gray>

editor:
  title: <gold>Configure</gold> <dark_gray>•</dark_gray> <crate>
  size: 27
  preview:
    slot: 10
    material: ENDER_EYE
    name: <aqua>Preview rewards</aqua>
    lore: []
  location:
    slot: 12
    material: LODESTONE
    name: <green>Link target block</green>
    lore:
    - <gray>Look at a block and click.</gray>
    - <dark_gray>Existing crate blocks stay linked.</dark_gray>
  capture:
    slot: 14
    material: HOPPER
    name: <light_purple>Capture held reward</light_purple>
    lore:
    - ''
    - <gray>Stores the complete item, including custom NBT.</gray>
    - <gray>New rewards begin with weight <white>10</white>.</gray>
  rewards:
    slot: 16
    material: CHEST
    name: <yellow>Manage rewards</yellow>
    lore:
    - <gray>Browse rewards and remove them with confirmation.</gray>
  key:
    slot: 22
    material: TRIPWIRE_HOOK
    name: <white>Give yourself a key</white>
    lore:
    - <gray>Uses the current live PlexonKeys template.</gray>
  back:
    slot: 18
    material: ARROW
    name: <gray>Back</gray>
    lore: []

confirm-delete:
  title: <red>Remove reward?</red>
  size: 27
  confirm:
    slot: 11
    material: LIME_CONCRETE
    name: <green>Confirm removal</green>
    lore: []
  cancel:
    slot: 15
    material: RED_CONCRETE
    name: <red>Keep reward</red>
    lore: []
