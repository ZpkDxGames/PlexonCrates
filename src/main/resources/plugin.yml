name: PlexonCrates
version: '${project.version}'
main: com.plexoncrates.core.PlexonCrates
api-version: '1.20'
author: Tonim
website: https://github.com/ZpkDxGames/PlexonCrates
description: Premium GUI-driven crates, animations, physical blocks, virtual keys and durable claims.

commands:
  crates:
    description: Open PlexonCrates, preview crates, administer crates, keys and rewards.
    usage: /crates [admin|preview|open|claims|link|unlink|key|reward|migrate|reload]
    aliases: [crate, pcrates]

permissions:
  plexoncrates.use:
    default: true
  plexoncrates.preview:
    default: true
  plexoncrates.open:
    default: true
  plexoncrates.admin:
    default: op
    children:
      plexoncrates.admin.gui: true
      plexoncrates.admin.link: true
      plexoncrates.admin.break: true
      plexoncrates.admin.keys: true
      plexoncrates.admin.rewards: true
      plexoncrates.admin.migrate: true
      plexoncrates.admin.reload: true
  plexoncrates.admin.gui:
    default: op
  plexoncrates.admin.link:
    default: op
  plexoncrates.admin.break:
    default: op
  plexoncrates.admin.keys:
    default: op
  plexoncrates.admin.rewards:
    default: op
  plexoncrates.admin.migrate:
    description: Scan, report, and import operator-owned PhoenixCratesLite data.
    default: op
  plexoncrates.admin.reload:
    default: op
